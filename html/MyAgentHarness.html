<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Dr. Andreas Fischer">
  <meta name="copyright" content="Dr. Andreas Fischer">
  <meta name="reply-to" content="andreasfischer1985@web.de">
  <title>MyAgentHarness v1.27</title>
  <!-- PDF.js für Client-seitiges PDF-Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <!-- Marked.js über CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <!-- JSZip für ZIP-Export der virtuellen Dateien -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-primary: #1e1e2e;
      --bg-secondary: #252538;
      --bg-card: #2b2b40;
      --text-main: #cdd6f4;
      --text-muted: #a6adc8;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --border: #45475a;
      --success: #a6e3a1;
      --warning: #f9e2af;
      --danger: #f38ba8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 360px;
      min-width: 220px;
      max-width: 75vw;
      background-color: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 9px;
      overflow-y: auto;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    body.sidebar-collapsed #sidebar {
      display: none;
    }

    #sidebar-resizer {
      width: 10px;
      background-color: var(--bg-primary);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: col-resize;
      user-select: none;
      flex-shrink: 0;
      position: relative;
      transition: background-color 0.15s;
    }

    #sidebar-resizer:hover,
    #sidebar-resizer.resizing {
      background-color: rgba(137, 180, 250, 0.14);
    }

    #sidebar-resizer::before {
      content: '';
      width: 2px;
      height: 36px;
      border-radius: 2px;
      background-color: var(--border);
    }

    #sidebar-resizer:hover::before,
    #sidebar-resizer.resizing::before {
      background-color: var(--accent);
    }

    #sidebar-toggle-btn {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 22px;
      padding: 0;
      font-size: 0.68rem;
      line-height: 1;
      border-radius: 3px;
      background: var(--bg-card);
      color: var(--accent);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    #sidebar-toggle-btn:hover {
      background: var(--border);
      color: var(--accent-hover);
    }

    #main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      min-width: 0;
    }

    #send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    #send-btn .btn-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(17, 17, 27, 0.25);
      border-top-color: #11111b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    #send-btn:disabled .btn-spinner {
      display: inline-block;
    }

    /* Style für klappbare Sidebar-Sektionen (kompakt) */
    details.section {
      background: var(--bg-card);
      padding: 8px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }
    details.section summary {
      font-size: 0.85rem;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin-bottom: 6px;
      list-style: none;
    }
    details.section:not([open]) summary {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    details.section summary::-webkit-details-marker {
      display: none;
    }
    details.section summary::after {
      content: ' ▼';
      font-size: 0.68rem;
      float: right;
      color: var(--text-muted);
    }
    details.section[open] summary::after {
      content: ' ▲';
    }

    #sidebar label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      line-height: 1.25;
    }

    #sidebar input[type="checkbox"] {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      cursor: pointer;
    }

    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    #sidebar input[type="text"],
    #sidebar input[type="number"],
    #sidebar textarea {
      padding: 5px 6px;
      font-size: 0.74rem;
      border-radius: 3px;
    }

    textarea { resize: vertical; }

    .file-upload-btn {
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      text-align: center;
      cursor: pointer;
      background: var(--bg-primary);
    }
    .file-upload-btn:hover { border-color: var(--accent); }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 5px; vertical-align: middle; }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-primary);
      padding: 4px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      margin-bottom: 4px;
      font-size: 0.73rem;
      gap: 4px;
    }
    .doc-item-left { display: flex; align-items: center; gap: 5px; overflow: hidden; min-width: 0; }
    .doc-item-left span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item-actions { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
    
    .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 0.78rem; padding: 1px 3px; border-radius: 3px; color: var(--text-main); }
    .btn-icon:hover { background: var(--border); }
    .btn-del { color: var(--danger); font-weight: bold; }

    #chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      position: relative;
    }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.assistant { align-self: flex-start; }
    .msg-wrapper.system-info { align-self: center; max-width: 100%; }

    .msg { padding: 10px 14px; border-radius: 6px; min-width: 0; font-size: 0.95rem; line-height: 1.4; word-break: break-word; overflow-wrap: break-word; width: 100%; }
    .msg-wrapper.user .msg { background: #313244; border: 1px solid var(--border); }
    .msg-wrapper.assistant .msg { background: #45475a; }
    .msg-wrapper.system-info .msg { background: transparent; color: var(--text-muted); font-size: 0.8rem; font-style: italic; text-align: center; }

    .msg-actions {
      display: flex;
      gap: 4px;
      margin-top: 2px;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    .msg-wrapper:hover .msg-actions { opacity: 1; }
    .msg-wrapper.user .msg-actions { justify-content: flex-end; }
    .msg-wrapper.assistant .msg-actions { justify-content: flex-start; }

    .msg-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .msg-action-btn:hover {
      background: transparent;
      color: var(--accent);
    }
    .msg-action-btn.btn-del-msg:hover {
      color: var(--danger);
    }

    .msg.assistant p { margin-bottom: 8px; }
    .msg.assistant p:last-child { margin-bottom: 0; }
    .msg.assistant pre { background: #181825; padding: 8px; border-radius: 4px; overflow-x: auto; margin: 6px 0; max-width: 100%; }
    .msg.assistant code { font-family: monospace; background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 3px; word-break: break-all; }
    .msg.assistant pre code { background: transparent; padding: 0; }
    .msg.assistant ul, .msg.assistant ol { margin-left: 20px; margin-bottom: 8px; }
    .msg.assistant img { max-width: 100%; border-radius: 4px; margin-top: 6px; }

    .tool-call-card {
      background: #181825;
      border: 1px dashed var(--accent);
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      align-self: flex-start;
      width: 90%;
    }
    .tool-call-card header { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    .tool-call-card .args { color: var(--warning); white-space: pre-wrap; margin-bottom: 6px; }
    .tool-call-card .result { color: var(--success); white-space: pre-wrap; background: #11111b; padding: 6px; border-radius: 4px; max-height: 150px; overflow-y: auto; }

    #chat-input-container {
      padding: 15px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #sidebar button {
      padding: 4px 8px;
      font-size: 0.72rem;
      border-radius: 3px;
    }

    .btn-row { display: flex; gap: 5px; margin-top: 4px; }
    .btn-secondary { background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); background: var(--border); }

    .approval-banner {
      background: #313244;
      border: 1px solid var(--warning);
      padding: 10px;
      margin-top: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .approval-btn { background: var(--success); color: #11111b; }
    .deny-btn { background: var(--danger); color: #11111b; }

    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
      width: 700px; max-width: 90%; max-height: 85vh; display: flex; flex-direction: column; padding: 20px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; }
    .modal-body { overflow-y: auto; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; font-family: monospace; background: var(--bg-primary); padding: 10px; border-radius: 4px; flex: 1; border: 1px solid var(--border); width: 100%; min-height: 200px; color: var(--text-main); }
  </style>
</head>
<body>

  <!-- Modal für Dokumentendetails & Editierung -->
  <div id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color: var(--accent);">Dokumenten-Details & Editor</h3>
        <div style="display: flex; gap: 8px;">
          <button onclick="saveModalDocChanges()">Speichern</button>
          <button class="btn-secondary" onclick="closeDocModal()">Schließen</button>
        </div>
      </div>
      <div style="margin-bottom: 10px; font-size: 0.85rem;" id="modal-meta-container">
        <label>Titel:</label>
        <input type="text" id="modal-input-title" style="margin-bottom: 6px;">
        <label>Kurzbeschreibung:</label>
        <textarea id="modal-input-desc" rows="2" style="margin-bottom: 6px;"></textarea>
        <div style="color: var(--text-muted); font-size: 0.8rem;" id="modal-filename-info"></div>
      </div>
      <label id="modal-content-label">Dokumenteninhalt:</label>
      <textarea class="modal-body" id="modal-input-content"></textarea>
    </div>
  </div>

  <!-- Modal für Nachrichten-Bearbeitung (mehrzeilig, Markdown) -->
  <div id="msg-edit-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1001;">
    <div class="modal-content" style="width: 750px;">
      <div class="modal-header">
        <h3 style="color: var(--accent);">Nachricht bearbeiten</h3>
        <div style="display: flex; gap: 8px;">
          <button onclick="saveMessageEdit()">Übernehmen</button>
          <button class="btn-secondary" onclick="closeMessageEditModal()">Abbrechen</button>
        </div>
      </div>
      <label style="margin-bottom: 4px; color: var(--text-muted);">Inhalt (Markdown / mehrzeilig):</label>
      <textarea id="msg-edit-textarea" class="modal-body" style="min-height: 300px; font-family: monospace;"></textarea>
    </div>
  </div>

  <!-- Sidebar / Config & Tools -->
  <div id="sidebar">
    <details class="section" open>
      <summary>KI-Server</summary>
      <label for="endpoint">Endpoint URL:</label>
      <input type="text" id="endpoint" value="http://127.0.0.1:1234/v1/chat/completions" onchange="updateMaxContextFromEndpoint(); saveStateToLocalStorage();">

      <label for="model-name" style="margin-top: 5px;">Modell:</label>
      <input type="text" id="model-name" list="models-list" value="gemma-4-12b-it" onchange="updateMaxContextFromEndpoint(); saveStateToLocalStorage();" onblur="updateMaxContextFromEndpoint();">
      <datalist id="models-list"></datalist>
      
      <label for="max-context" style="margin-top: 5px;">Max. Kontext (Tokens):</label>
      <input type="number" id="max-context" value="4096" onchange="updateContextUsageDisplay(); saveStateToLocalStorage();">
      
      <div style="margin-top: 6px;" id="context-usage-container">
        <div id="context-usage-text" style="color: var(--text-muted); font-size: 0.72rem; margin-bottom: 3px;">Auslastung: 0 / 4096 Tokens (0%)</div>
        <div style="background: var(--bg-primary); border: 1px solid var(--border); border-radius: 3px; height: 6px; overflow: hidden;">
          <div id="context-usage-bar" style="background: var(--success); width: 0%; height: 100%; transition: width 0.3s;"></div>
        </div>
      </div>
    </details>

    <!-- Session Management -->
    <details class="section" open>
      <summary>Session</summary>
      <div class="btn-row">
        <button class="btn-secondary" onclick="exportSession()" style="flex: 1;">Export JSON</button>
        <button class="btn-secondary" onclick="document.getElementById('importSessionInput').click()" style="flex: 1;">Import JSON</button>
        <button class="btn-secondary" onclick="clearSession()" style="color: var(--danger); border-color: var(--danger);" title="Session zurücksetzen">Reset</button>
      </div>
      <input type="file" id="importSessionInput" accept=".json" style="display: none;" onchange="importSession(event)">
    </details>

    <details class="section" open style="display: flex; flex-direction: column;">
      <summary>AGENT.md</summary>
      <textarea id="agent-md" style="flex: 1; min-height: 70px; margin-top: 4px;" oninput="syncAgentMdToDoc(); updateContextUsageDisplay(); saveStateToLocalStorage();">Du bist ein hilfsbereiter KI-Assistent mit Zugriff auf virtuelle Dokumente, Web-, Code- und Bildgenerierungs-Tools. Nutze search_web, wenn du etwas nicht weißt. Nutze read_doc und write_doc, um Dateien zu lesen und zu schreiben.</textarea>
    </details>

    <!-- Virtuelle Dokumente Sektion -->
    <details class="section" open>
      <summary>Virtuelle Dateien</summary>
      <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg,.md" multiple style="display: none;">
      <div class="file-upload-btn" id="upload-btn-container" onclick="document.getElementById('fileInput').click()" style="margin-top: 4px;">
        <span style="font-size: 0.73rem; color: var(--text-muted);">+ Dokumente/Bilder hochladen</span>
      </div>
      <div id="docList" style="margin-top: 6px;"></div>
      <div class="btn-row" style="margin-top: 6px;">
        <button type="button" class="btn-secondary" id="download-all-docs-btn" onclick="downloadAllDocsAsZip()" style="width: 100%;">Download (ZIP)</button>
      </div>
    </details>

    <details class="section" open>
      <summary>Verfügbare Tools</summary>
      <div class="checkbox-group" id="tools-container" style="margin-top: 4px; display: flex; flex-direction: column; gap: 2px;">
        <label><input type="checkbox" id="tool-read_doc" checked onchange="saveStateToLocalStorage()"> read_doc (Virtuelle Dateien)</label>
        <label><input type="checkbox" id="tool-write_doc" checked onchange="saveStateToLocalStorage()"> write_doc (Virtuelle Dateien)</label>
        <label><input type="checkbox" id="tool-gsub_doc" checked onchange="saveStateToLocalStorage()"> gsub_doc (Regex-Ersetzung)</label>
        <label><input type="checkbox" id="tool-search_doc" checked onchange="saveStateToLocalStorage()"> search_doc (Virtuelle Dateien)</label>
        <label><input type="checkbox" id="tool-search_web" checked onchange="saveStateToLocalStorage()"> search_web (DuckDuckGo)</label>
        <label><input type="checkbox" id="tool-fetch_url" checked onchange="saveStateToLocalStorage()"> fetch_url</label>
        <label><input type="checkbox" id="tool-search_wikipedia" checked onchange="saveStateToLocalStorage()"> search_wikipedia</label>
        <label><input type="checkbox" id="tool-get_weather" checked onchange="saveStateToLocalStorage()"> get_weather</label>
        <label><input type="checkbox" id="tool-calculate" checked onchange="saveStateToLocalStorage()"> calculate</label>
        <label><input type="checkbox" id="tool-run_code" checked onchange="saveStateToLocalStorage()"> run_code (JavaScript)</label>
        <label><input type="checkbox" id="tool-run_content_analysis" checked onchange="saveStateToLocalStorage()"> run_content_analysis (<a href="https://doi.org/10.25656/01:34405" target="_blank">Fischer, 2025</a>)</label>
        <label><input type="checkbox" id="tool-generate_image" checked onchange="saveStateToLocalStorage()"> generate_image</label>
      </div>
    </details>

    <details class="section" open>
      <summary>Sicherheit</summary>
      <div class="checkbox-group" style="margin-top: 4px;">
        <label><input type="checkbox" id="require-approval" checked onchange="saveStateToLocalStorage()"> Tool-Calls manuell freigeben</label>
      </div>
    </details>
  </div>

  <!-- Horizontaler Resize-Griff + Ein-/Ausklapp-Button -->
  <div id="sidebar-resizer" title="Ziehen zum Ändern der Breite">
    <button type="button" id="sidebar-toggle-btn" onclick="toggleSidebarCollapsed()" title="Seitenleiste ein-/ausklappen">◀</button>
  </div>

  <!-- Chat Panel -->
  <div id="main-chat">
    <div id="chat-messages">
      <div class="msg-wrapper system-info"><div class="msg system-info">Starte neue Session.</div></div>
    </div>

    <div id="chat-input-container">
      <textarea id="user-input" rows="2" placeholder="Frage oder Anweisung eingeben..."></textarea>
      <button id="send-btn" onclick="handleSend()">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-label">Senden</span>
      </button>
      <button id="cancel-btn" class="btn-secondary" onclick="cancelAgent()" style="display: none; background: var(--danger); color: #11111b; border: none;">Abbrechen</button>
    </div>
  </div>

  <script>
    let uploadedDocs = {};
    let docCounter = 0;
    let chatHistory = [];
    let currentModalDocId = null;
    let toolCache = new Map();
    let currentEditingIndex = null;

    let currentAbortController = null;
    let isCancelled = false;
    let chatHistorySnapshotBeforeSend = null;

    let sidebarWidth = 360;
    let sidebarCollapsed = false;

    const DEFAULT_AGENT_MD = "Du bist ein hilfsbereiter KI-Assistent mit Zugriff auf virtuelle Dokumente, Web-, Code- und Bildgenerierungs-Tools. Nutze search_web, wenn du etwas nicht weißt. Nutze read_doc und write_doc, um Dateien zu lesen und zu schreiben.";

    function applySidebarLayout() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebar-toggle-btn');
      if (sidebar) {
        sidebar.style.width = `${sidebarWidth}px`;
      }
      if (sidebarCollapsed) {
        document.body.classList.add('sidebar-collapsed');
        if (toggleBtn) {
          toggleBtn.textContent = '▶';
          toggleBtn.title = 'Seitenleiste ausklappen';
        }
      } else {
        document.body.classList.remove('sidebar-collapsed');
        if (toggleBtn) {
          toggleBtn.textContent = '◀';
          toggleBtn.title = 'Seitenleiste einklappen';
        }
      }
    }

    function toggleSidebarCollapsed() {
      sidebarCollapsed = !sidebarCollapsed;
      applySidebarLayout();
      saveStateToLocalStorage();
    }

    function initSidebarResizer() {
      const resizer = document.getElementById('sidebar-resizer');
      const toggleBtn = document.getElementById('sidebar-toggle-btn');
      if (!resizer) return;

      let isDragging = false;
      let startX = 0;
      let startWidth = sidebarWidth;

      resizer.addEventListener('mousedown', (e) => {
        if (toggleBtn && (e.target === toggleBtn || toggleBtn.contains(e.target))) return;
        e.preventDefault();
        if (sidebarCollapsed) {
          sidebarCollapsed = false;
          applySidebarLayout();
        }
        isDragging = true;
        startX = e.clientX;
        startWidth = document.getElementById('sidebar').getBoundingClientRect().width || sidebarWidth;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        const minW = 220;
        const maxW = Math.max(300, Math.floor(window.innerWidth * 0.75));
        sidebarWidth = Math.max(minW, Math.min(maxW, Math.round(startWidth + deltaX)));
        document.getElementById('sidebar').style.width = `${sidebarWidth}px`;
      });

      window.addEventListener('mouseup', () => {

    function loadStateFromLocalStorage() {

      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        if (state.endpoint) document.getElementById('endpoint').value = state.endpoint;
        if (state.modelName) document.getElementById('model-name').value = state.modelName;
        if (state.maxContext) document.getElementById('max-context').value = state.maxContext;

        if (typeof state.sidebarWidth === 'number' && !Number.isNaN(state.sidebarWidth)) sidebarWidth = state.sidebarWidth;
        if (typeof state.sidebarCollapsed === 'boolean') sidebarCollapsed = state.sidebarCollapsed;
        if (state.toolCache) toolCache = new Map(state.toolCache);
        
        if (state.uploadedDocs) {
          uploadedDocs = state.uploadedDocs;
          document.getElementById('docList').innerHTML = "";
          for (const [id, doc] of Object.entries(uploadedDocs)) {
            addDocToUI(id, doc.name, doc.title, doc.isImage, doc.selected !== false);
            if (doc.name === 'AGENT.md' && state.agentMd) {
              doc.content = state.agentMd;
            }
          }
        }

        if (state.chatHistory && Array.isArray(state.chatHistory)) {
          chatHistory = state.chatHistory;
          const container = document.getElementById('chat-messages');
          container.innerHTML = '<div class="msg-wrapper system-info"><div class="msg system-info">Neue Session gestartet.</div></div>';
          
          const getToolResultText = (toolCallId) => {
            const found = chatHistory.find(m => m.role === 'tool' && m.tool_call_id === toolCallId);
            return found ? found.content : '[Ergebnis nicht verfügbar]';
          };

          for (let i = 0; i < chatHistory.length; i++) {
            const msg = chatHistory[i];
            if (msg.role === 'user') {
              let displayTxt = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '[Multimodale Nachricht]');
              appendMessageUI('user', displayTxt, null, i);
            } else if (msg.role === 'assistant') {
              if (msg.content) appendMessageUI('assistant', msg.content, null, i);
              if (msg.tool_calls && Array.isArray(msg.tool_calls)) {
                for (const tc of msg.tool_calls) {
                  let argsParsed = {};
                  try { argsParsed = JSON.parse(tc.function.arguments); } catch(e){}
                  const resText = getToolResultText(tc.id);
                  renderToolResultUI(tc.id, tc.function.name, argsParsed, resText);
                }
              }
            }
          }
        }
        updateContextUsageDisplay();
      } catch(e) {
        console.error("Fehler beim Laden des LocalStorage:", e);
      }
    }

    async function downloadAllDocsAsZip() {
      const entries = Object.entries(uploadedDocs);
      if (entries.length === 0) {
        alert("Keine virtuellen Dateien zum Herunterladen vorhanden.");
        return;
      }
      if (typeof JSZip === 'undefined') {
        alert("JSZip konnte nicht geladen werden. Bitte Internetverbindung prüfen.");
        return;
      }

      const btn = document.getElementById('download-all-docs-btn');
      const origText = btn ? btn.textContent : 'Download (ZIP)';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Erstelle ZIP...';
      }

      try {
        const zip = new JSZip();
        const folder = zip.folder('virtuelle_dateien');
        const usedNames = new Set();

        const makeUniqueFileName = (rawName, fallbackExt = '.txt') => {
          let safe = (rawName || 'dokument').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'dokument';
          if (!/\.[a-zA-Z0-9]{1,8}$/.test(safe)) {
            safe += fallbackExt;
          }
          let candidate = safe;
          let counter = 2;
          while (usedNames.has(candidate.toLowerCase())) {
            const dotIdx = safe.lastIndexOf('.');
            if (dotIdx > 0) {
              candidate = `${safe.slice(0, dotIdx)}_${counter}${safe.slice(dotIdx)}`;
            } else {
              candidate = `${safe}_${counter}`;
            }
            counter++;
          }
          usedNames.add(candidate.toLowerCase());
          return candidate;
        };

        for (const [id, doc] of entries) {
          if (doc.isImage && typeof doc.content === 'string' && doc.content.startsWith('data:')) {
            const match = doc.content.match(/^data:image\/([a-zA-Z0-9+.-]+);base64,(.*)$/);
            if (match) {
              const extMap = { jpeg: '.jpg', jpg: '.jpg', png: '.png', webp: '.webp', gif: '.gif' };
              const ext = extMap[match[1].toLowerCase()] || `.${match[1].toLowerCase()}`;
              const fileName = makeUniqueFileName(doc.name || id, ext);
              folder.file(fileName, match[2], { base64: true });
              continue;
            }
          }
          const fileName = makeUniqueFileName(doc.name || id, '.txt');
          folder.file(fileName, doc.content || '');
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `virtuelle-dateien-${Date.now()}.zip`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Fehler beim Erstellen der ZIP-Datei: " + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = origText;
        }
      }
    }

    async function updateMaxContextFromEndpoint() {
      const maxContextInput = document.getElementById('max-context');
      const endpoint = document.getElementById('endpoint').value.trim();
      const modelField = document.getElementById('model-name');
      const datalist = document.getElementById('models-list');
      const modelVal = modelField.value.trim().toLowerCase();
      
      let baseUrl = endpoint.includes('/v1/') ? endpoint.split('/v1/')[0] : endpoint.replace(/\/+$/, '');
      const info_url = `${baseUrl}/api/v1/models`;
      const headers = {};
      const apiKey = document.getElementById('api-key')?.value;
      if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;
    
      try {
        const response = await fetch(info_url, { headers });
        if (!response.ok) throw new Error('Netzwerk-Fehler');
        const data = await response.json();
    
        let maxTokens = null;
        const modelsList = data.models || data.data || (Array.isArray(data) ? data : null);
    
        if (Array.isArray(modelsList) && modelsList.length > 0) {
          if (datalist) {
            datalist.innerHTML = '';
            modelsList.forEach(m => {
              const mId = m.id || m.key || m.name;
              if (mId) {
                const option = document.createElement('option');
                option.value = mId;
                datalist.appendChild(option);
              }
            });
          }
    
          const validModelMatch = modelsList.find(m => {
            const mId = (m.id || m.key || m.name || "").toLowerCase();
            return mId === modelVal || mId.includes(modelVal) || modelVal.includes(mId);
          });
    
          let currentModel = validModelMatch || modelsList[0];
          if (!validModelMatch && currentModel) {
            const fetchedName = currentModel.id || currentModel.name || currentModel.key;
            if (fetchedName) modelField.value = fetchedName;
          }
    
          if (currentModel) {
            maxTokens = currentModel.max_context_length || currentModel.context_length || currentModel.max_model_len;
          }
        } else if (data.max_tokens) {
          maxTokens = data.max_tokens;
        }
    
        if (maxTokens && (!maxContextInput.value || maxContextInput.value == "4096")) {
          maxContextInput.value = maxTokens;
        }
      } catch (e) {
        if (!maxContextInput.value) {
          maxContextInput.value = 4096;
        }
      }
      
      updateContextUsageDisplay();
      saveStateToLocalStorage();
    }

    let activeFrozenSystemPrompt = null;

    function getCompleteSystemPrompt() {
      if (activeFrozenSystemPrompt !== null) {
        return activeFrozenSystemPrompt;
      }

      let baseAgentMd = document.getElementById('agent-md').value;
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (doc.name === 'AGENT.md' && doc.selected !== false) {
          baseAgentMd = doc.content;
          break;
        }
      }

      let activeDocsSection = "";
      let count = 0;

      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (doc.selected !== false) {
          if (count === 0) {
            activeDocsSection += "\n\n--- VIRTUELLE DOKUMENTE ---\n";
          }
          count++;
          activeDocsSection += `- ID: \`${id}\` | Dateiname: \`${doc.name}\` | Titel: **${doc.title}** | Seiten: ${doc.page_count || 1}\n  Beschreibung: ${doc.description}\n`;
        }
      }

      return baseAgentMd + activeDocsSection;
    }

    function estimateTotalTokens(messages) {
      let chars = 0;
      for (const m of messages) {
        chars += 4;
        if (m.role) chars += m.role.length;
        if (typeof m.content === 'string') chars += m.content.length;
        else if (Array.isArray(m.content)) chars += JSON.stringify(m.content).length;
        if (m.tool_calls) chars += JSON.stringify(m.tool_calls).length;
        if (m.tool_call_id) chars += m.tool_call_id.length;
      }
      return Math.ceil(chars / 4);
    }

    function updateContextUsageDisplay() {
      const fullSystemPrompt = getCompleteSystemPrompt();
      const messages = [{ role: "system", content: fullSystemPrompt }, ...chatHistory];
      const totalTokens = estimateTotalTokens(messages);
      const maxTokens = parseInt(document.getElementById('max-context').value) || 4096;
      const percentage = Math.min(100, Math.round((totalTokens / maxTokens) * 100));

      const usageText = document.getElementById('context-usage-text');
      const usageBar = document.getElementById('context-usage-bar');
      if (usageText && usageBar) {
        usageText.innerText = `Auslastung: ${totalTokens} / ${maxTokens} Tokens (${percentage}%)`;
        usageBar.style.width = `${percentage}%`;
        usageBar.style.backgroundColor = percentage > 80 ? 'var(--danger)' : percentage > 60 ? 'var(--warning)' : 'var(--success)';
      }
    }

    async function handleContextOverflow(messagesRef, maxContextTokens, model = "gemma-4-12b-it", apiUrl = "http://127.0.0.1:1234/v1/chat/completions") {
      const threshold = Math.floor(maxContextTokens * 0.80);
      if (estimateTotalTokens(messagesRef) <= threshold) {
        return false;
      }
        
      let systemMsg = null;
      if (messagesRef.length > 0 && (messagesRef[0].role || '') === 'system') {
        systemMsg = messagesRef.shift();
      }
    
      let lastUserMsgIndex = -1;
      for (let i = messagesRef.length - 1; i >= 0; i--) {
        if ((messagesRef[i].role || '') === 'user') {
          lastUserMsgIndex = i;
          break;
        }
      }
    
      let lastUserMsg = null;
      if (lastUserMsgIndex !== -1) {
        lastUserMsg = messagesRef.splice(lastUserMsgIndex, 1)[0];
      }
    
      const rebuildAndCheck = () => {
        let current = [];
        if (systemMsg !== null) current.push(systemMsg);
        for (const m of messagesRef) current.push(m);
        if (lastUserMsg !== null) current.push(lastUserMsg);
        let tokens = estimateTotalTokens(current);
        return { messages: current, tokens: tokens, ok: tokens <= threshold };
      };
    
      let toolIndices = [];
      messagesRef.forEach((m, idx) => {
        if ((m.role || '') === 'tool') toolIndices.push(idx);
      });
    
      if (toolIndices.length > 0) {
        let lastToolIdx = toolIndices.pop();
        for (const idx of toolIndices) {
          if (messagesRef[idx]) {
            messagesRef[idx].content = "[wegen Context-Overflow entfernt]";
          }
        }
    
        let check = rebuildAndCheck();
        if (check.ok) {
          messagesRef.length = 0;
          messagesRef.push(...check.messages);
          return true;
        }

        if (messagesRef[lastToolIdx]) {
          let content = Array.isArray(messagesRef[lastToolIdx].content)
            ? JSON.stringify(messagesRef[lastToolIdx].content)
            : (messagesRef[lastToolIdx].content || '');
          messagesRef[lastToolIdx].content = content.substring(0, 500) + "\n[wegen Context-Overflow gekürzt]";
        }
    
        check = rebuildAndCheck();
        if (check.ok) {
          messagesRef.length = 0;
          messagesRef.push(...check.messages);
          return true;
        }
      }

      let historyText = "";
      for (const m of messagesRef) {
        let role = m.role || 'user';
        let content = m.tool_calls ? "[Tool-Aufruf]" : (Array.isArray(m.content) ? JSON.stringify(m.content) : (m.content || ''));
        if (content !== '') {
          if (content.length > 4000) {
            content = content.substring(0, 1500) + "\n[... Inhalt gekürzt ...]\n" + content.substring(content.length - 1500);
          }
          historyText += `[${role}]: ${content}\n`;
        }
      }

      let messagesRef2 = [...messagesRef];      
      let summary = "";
      if (historyText.trim() !== "") {
        let summaryPayload = {
          model: model,
          messages: [
            { role: "system", content: "Fasse den folgenden Text oder Gesprächsverlauf extrem präzise und kompakt zusammen:" },
            { role: "user", content: historyText }
          ],
          max_tokens: 800,
          temperature: 0.1,
          stream: false
        };
      
        try {
          let sumRes = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(summaryPayload)
          });
          if (sumRes.ok) {
            let dataSum = await sumRes.json();
            summary = dataSum.choices?.[0]?.message?.content || '';
          }
        } catch (e) {}
      }
      
      messagesRef.length = 0;
      if (summary !== "") {
        messagesRef.push({
          role: "assistant",
          content: "Zusammenfassung der bisherigen Unterhaltung: " + summary
        });
      }
      
      let check = rebuildAndCheck();
      if (check.ok) {
        messagesRef.length = 0;
        messagesRef.push(...check.messages);
        return true;
      }
      
      messagesRef.length = 0;
      messagesRef.push(...messagesRef2);

      while (messagesRef.length > 0 && !rebuildAndCheck().ok) {
        messagesRef.shift();
      }

      let finalRebuild = rebuildAndCheck();
      if (!finalRebuild.ok && lastUserMsg !== null) {
        let content = Array.isArray(lastUserMsg.content) ? JSON.stringify(lastUserMsg.content) : (lastUserMsg.content || '');
        lastUserMsg.content = content.substring(0, 1000) + "\n[wegen extremem Context-Overflow gekürzt]";
      }
      
      if (!rebuildAndCheck().ok && systemMsg !== null) {
        let content = Array.isArray(systemMsg.content) ? JSON.stringify(systemMsg.content) : (systemMsg.content || '');
        systemMsg.content = content.substring(0, 1000) + "\n[System-Prompt wegen Context-Overflow gekürzt]";
      }
      
      let finalCheck = rebuildAndCheck();
      messagesRef.length = 0;
      messagesRef.push(...finalCheck.messages);
      return true;
    }   

    async function generateDocMetadata(fileName, fileContent) {
      if (fileName === 'AGENT.md') {
        return { title: 'System Prompt (AGENT.md)', description: 'Virtuelle Konfigurationsdatei für den System-Prompt.' };
      }
      const endpoint = document.getElementById('endpoint').value.trim();
      const modelVal = document.getElementById('model-name').value;
      const snippet = fileContent.substring(0, 3000);

      const prompt = `Analysiere den folgenden Dateinamen und Textauszug. Generiere im JSON-Format genau zwei Felder:
1. "title": Ein aussagekräftiger Titel für das Dokument.
2. "description": Eine präzise Kurzbeschreibung (ca. 1-2 Sätze) des Inhalts.

Dateiname: ${fileName}
Auszug:
${snippet}

Antworte AUSSCHLIESSLICH im JSON-Format: {"title": "...", "description": "..."}`;

      try {
        const res = await fetch(endpoint.includes('/chat/completions') ? endpoint : endpoint.replace(/\/+$/, '') + '/v1/chat/completions', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelVal,
            messages: [{ role: "user", content: prompt }],
            temperature: 0.1,
            max_tokens: 300
          })
        });
        if (res.ok) {
          const data = await res.json();
          let rawText = data.choices?.[0]?.message?.content || '';
          rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(rawText);
          return {
            title: parsed.title || fileName,
            description: parsed.description || "Keine Kurzbeschreibung verfügbar."
          };
        }
      } catch (e) {}
      return { title: fileName, description: "Automatische Kurzbeschreibung nicht verfügbar." };
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const files = e.target.files;
      if (!files.length) return;

      const uploadContainer = document.getElementById('upload-btn-container');
      const originalHTML = uploadContainer.innerHTML;
      uploadContainer.innerHTML = `<span class="spinner"></span> <span style="font-size: 0.73rem; color: var(--text-muted);">Dokumente werden eingelesen...</span>`;
      uploadContainer.style.pointerEvents = 'none';

      try {
        for (const file of files) {
          let extractedText = "";
          let metadataSnippet = "";
          let isImage = false;
          let pageCount = 1;

          if (file.type.startsWith("image/") || /\.(png|jpg|jpeg|webp)$/i.test(file.name)) {
            isImage = true;
            const base64Data = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.readAsDataURL(file);
            });
            extractedText = base64Data;
            metadataSnippet = file.name;
            pageCount = 1;
          } else if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            pageCount = pdf.numPages || 1;
            let fullText = "";
            let snippetText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageStr = `--- Seite ${i} ---\n` + textContent.items.map(item => item.str).join(" ") + "\n\n";
              fullText += pageStr;
              if (i <= 5) {
                snippetText += pageStr;
              }
            }
            extractedText = fullText;
            metadataSnippet = snippetText;
          } else {
            extractedText = await file.text();
            metadataSnippet = extractedText;
            pageCount = 1;
          }

          const meta = await generateDocMetadata(file.name, metadataSnippet);

          let targetId = null;
          for (const [id, doc] of Object.entries(uploadedDocs)) {
            if (doc.name === 'AGENT.md' && file.name === 'AGENT.md') {
              targetId = id;
              break;
            }
          }

          if (targetId) {
            uploadedDocs[targetId].content = extractedText;
            uploadedDocs[targetId].title = meta.title;
            uploadedDocs[targetId].description = meta.description;
            uploadedDocs[targetId].page_count = pageCount;
            if (file.name === 'AGENT.md') {
              document.getElementById('agent-md').value = extractedText;
            }
          } else {
            docCounter++;
            const docId = `doc_${docCounter}`;
            uploadedDocs[docId] = {
              id: docId,
              name: file.name,
              title: meta.title,
              description: meta.description,
              content: extractedText,
              isImage,
              selected: true,
              page_count: pageCount
            };
            addDocToUI(docId, file.name, meta.title, isImage, true);
            if (file.name === 'AGENT.md') {
              document.getElementById('agent-md').value = extractedText;
            }
          }
        }
      } finally {
        uploadContainer.innerHTML = originalHTML;
        uploadContainer.style.pointerEvents = 'auto';
        this.value = "";
        updateContextUsageDisplay();
        saveStateToLocalStorage();
      }
    });

    function addDocToUI(id, name, title, isImage = false, selected = true) {
      const docList = document.getElementById('docList');
      if (document.getElementById(`item_${id}`)) return;
      const div = document.createElement('div');
      div.className = 'doc-item';
      div.id = `item_${id}`;

      div.innerHTML = `

          <button type="button" class="btn-icon" title="Details einsehen & editieren" onclick="openDocModal('${id}')">👁️</button>
          <button type="button" class="btn-icon" title="Export (Titel, Beschreibung, Inhalt)" onclick="exportDocTxt('${id}')">📥</button>

    function exportDocTxt(id) {

      const exportContent = `ID: ${id}\nTitel: ${doc.title}\nDateiname: ${doc.name}\nSeiten: ${doc.page_count || 1}\nKurzbeschreibung:\n${doc.description}\n\n========================================\nINHALT:\n========================================\n\n${doc.content}`;
      const blob = new Blob([exportContent], { type: 'text/plain;charset=utf-8' });

      const a = document.createElement('a');
      a.href = url;
      a.download = `${doc.name.replace(/\.[^/.]+$/, "")}_export.txt`;

    async function perform_read_doc(args) {
      const docIdentifier = args.document_id || args.id || args.name;
      let targetDoc = null;
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (id === docIdentifier || doc.name === docIdentifier) {
          targetDoc = doc;
          break;
        }
      }

      if (!targetDoc) {
        return `Fehler: Dokument '${docIdentifier}' nicht gefunden. Verfügbare Dokumente: ` + Object.values(uploadedDocs).map(d => `${d.name} (${d.id})`).join(', ');
      }

      if (targetDoc.isImage) {
        return `Dokument '${targetDoc.name}' ist eine Bilddatei.`;
      }

      let content = targetDoc.content;
      const totalPages = targetDoc.page_count || 1;

      const startPage = parseInt(args.start_page !== undefined ? args.start_page : (args.page_start !== undefined ? args.page_start : 1)) || 1;
      const endPageInput = parseInt(args.end_page !== undefined ? args.end_page : (args.page_end !== undefined ? args.page_end : totalPages));
      const endPage = Math.min(isNaN(endPageInput) ? totalPages : endPageInput, totalPages);

      if (content.includes("--- Seite ")) {
        let pagesMap = {};
        let parts = content.split(/--- Seite (\d+) ---/);
        for (let i = 1; i < parts.length; i += 2) {
          let pNum = parseInt(parts[i]);
          let pText = parts[i+1] || "";
          pagesMap[pNum] = pText;
        }

        let filteredParts = [];
        for (let p = Math.max(1, startPage); p <= endPage; p++) {
          if (pagesMap[p] !== undefined) {
            filteredParts.push(`--- Seite ${p} ---\n` + pagesMap[p]);
          }
        }
        if (filteredParts.length > 0) {
          content = filteredParts.join("\n");
        }
      }      

      return `Inhalt von Dokument '${targetDoc.name}' (ID: ${targetDoc.id}, Seiten ${Math.max(1, startPage)}-${endPage} von ${totalPages}):\n\n` + content;
    }

    function perform_write_doc(args) {
      const fileName = args.name || args.filename || args.document_id;
      if (!fileName) return "Fehler: Es wurde kein Dateiname ('name') angegeben.";
      
      const isAgentMd = fileName.toLowerCase() === 'agent.md';
      const normalizedFileName = isAgentMd ? 'AGENT.md' : fileName;

      const title = args.title || (isAgentMd ? 'System Prompt (AGENT.md)' : normalizedFileName);
      const description = args.description || "Vom Agenten erstellte oder bearbeitete Datei.";
      const contentToAdd = args.content !== undefined ? String(args.content) : "";
      const isAppend = args.append === true || args.append === "true";
      const pageCount = parseInt(args.page_count || args.pages) || 1;

      let existingDocId = null;
      let existingDoc = null;
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (doc.name.toLowerCase() === normalizedFileName.toLowerCase() || id === fileName) {
          existingDocId = id;
          existingDoc = doc;
          break;
        }
      }

      let finalContent = contentToAdd;
      let finalPageCount = pageCount;
      if (isAppend && existingDoc) {
        finalContent = existingDoc.content + "\n" + contentToAdd;
        finalPageCount = (existingDoc.page_count || 1) + pageCount;
      }

      if (existingDocId) {
        uploadedDocs[existingDocId].name = normalizedFileName;
        uploadedDocs[existingDocId].content = finalContent;
        uploadedDocs[existingDocId].title = title;
        uploadedDocs[existingDocId].description = description;
        uploadedDocs[existingDocId].page_count = finalPageCount;
      } else {
        docCounter++;
        const newId = `doc_${docCounter}`;
        uploadedDocs[newId] = {
          id: newId,
          name: normalizedFileName,
          title: title,
          description: description,
          content: finalContent,
          isImage: false,
          selected: true,
          page_count: finalPageCount
        };
        addDocToUI(newId, normalizedFileName, title, false, true);
        existingDocId = newId;
      }

      if (isAgentMd) {
        document.getElementById('agent-md').value = finalContent;
      }

      if (currentModalDocId === existingDocId) {
        const contentField = document.getElementById('modal-input-content');
        if (contentField && !contentField.disabled) {
          contentField.value = finalContent;
        }
        document.getElementById('modal-input-title').value = title;
        document.getElementById('modal-input-desc').value = description;
      }

      updateContextUsageDisplay();
      saveStateToLocalStorage();
      return `Erfolg: Datei '${normalizedFileName}' (ID: ${existingDocId}) wurde erfolgreich ${isAppend ? 'ergänzt (append)' : 'geschrieben'} (Seitenanzahl: ${finalPageCount}).`;
    }

    function perform_gsub_doc(args = {}) {
      const params = typeof args === 'string' ? {} : (args || {});
      const docIdentifier = params.document_id || params.id || params.name || params.filename;
      if (!docIdentifier) {
        return "Fehler: Kein Dokument ('document_id' / 'name') angegeben.";
      }

      const rawPattern = params.pattern !== undefined ? String(params.pattern) : (params.regex !== undefined ? String(params.regex) : "");
      if (!rawPattern) {
        return "Fehler: Kein regulärer Ausdruck ('pattern') angegeben.";
      }

      const replacement = params.replacement !== undefined ? String(params.replacement) : (params.replace !== undefined ? String(params.replace) : "");
      let flags = params.flags !== undefined ? String(params.flags).trim() : "g";
      if (!flags.includes("g")) {
        flags += "g";
      }

      let targetId = null;
      let targetDoc = null;
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (id === docIdentifier || doc.name === docIdentifier || doc.name.toLowerCase() === String(docIdentifier).toLowerCase()) {
          targetId = id;
          targetDoc = doc;
          break;
        }
      }

      if (!targetDoc) {
        return `Fehler: Dokument '${docIdentifier}' nicht gefunden. Verfügbare Dokumente: ` +
          Object.values(uploadedDocs).map(d => `${d.name} (${d.id})`).join(', ');
      }

      if (targetDoc.isImage) {
        return `Fehler: Dokument '${targetDoc.name}' ist eine Bilddatei und unterstützt keine Regex-Ersetzung.`;
      }

      let regex;
      try {
        regex = new RegExp(rawPattern, flags);
      } catch (err) {
        return `Fehler: Ungültiger regulärer Ausdruck '/${rawPattern}/${flags}': ${err.message}`;
      }

      const originalContent = targetDoc.content || "";
      const matches = originalContent.match(regex);
      const matchCount = matches ? matches.length : 0;
      const updatedContent = originalContent.replace(regex, replacement);

      targetDoc.content = updatedContent;
      if (typeof params.title === "string" && params.title.trim()) {
        targetDoc.title = params.title.trim();
      }
      if (typeof params.description === "string" && params.description.trim()) {
        targetDoc.description = params.description.trim();
      }

      if (targetDoc.name === 'AGENT.md') {
        document.getElementById('agent-md').value = updatedContent;
      }

      if (currentModalDocId === targetId) {
        const contentField = document.getElementById('modal-input-content');
        if (contentField && !contentField.disabled) {
          contentField.value = updatedContent;
        }
      }

      updateContextUsageDisplay();
      saveStateToLocalStorage();

      return `Erfolg: ${matchCount} Treffer in '${targetDoc.name}' (${targetId}) mit /${rawPattern}/${flags} ersetzt.`;
    }

          error: (...args) => logs.push("[ERROR] " + args.join(' ')),

    async function perform_fetch_url(url) {
      if (!url) return "Fehler: Keine URL angegeben.";
          
      if (url.includes('github.com')) {
        try {
          const match = url.match(/github\.com\/([^/]+)\/([^/]+)/);
          if (match) {
            const owner = match[1];
            const repo = match[2].replace(/\.git$/, '');
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}`;
            
            const response = await fetch(apiUrl, { 
              headers: { 'Accept': 'application/vnd.github.v3+json' },
              signal: AbortSignal.timeout(8000) 
            });
            
            if (!response.ok) throw new Error(`GitHub API Fehler: HTTP ${response.status}`);
            const repoData = await response.json();

            let readmeContent = "Keine README.md gefunden.";
            try {
              const readmeRes = await fetch(`${apiUrl}/readme`, {
                headers: { 'Accept': 'application/vnd.github.v3.raw' },
                signal: AbortSignal.timeout(5000)
              });
              if (readmeRes.ok) {
                readmeContent = await readmeRes.text();
                if (readmeContent.length > 3000) {
                  readmeContent = readmeContent.substring(0, 3000) + "\n[... README gekürzt ...]";
                }
              }
            } catch (e) {}
            
            return `GitHub Repository Info (${owner}/${repo}):\n` +
                   `- Beschreibung: ${repoData.description || 'Keine'}\n` +
                   `- Hauptsprache: ${repoData.language || 'Unbekannt'}\n` +
                   `- Sterne: ${repoData.stargazers_count} | Forks: ${repoData.forks_count}\n` +
                   `- URL: ${repoData.html_url}\n\n` +
                   `=== README.md ===\n${readmeContent}`;
          }
        } catch (e) {
          console.warn("GitHub API-Abruf fehlgeschlagen, versuche Fallback:", e.message);
        }
      }
  
      try {
        const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (response.ok) {
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          doc.querySelectorAll('script, style, nav, footer, header').forEach(el => el.remove());
          return `Inhalt von URL (${url}):\n` + (doc.body.textContent || "").replace(/\s+/g, ' ').trim().substring(0, 4000);
        }
      } catch (e) {}
    
      const proxyServices = [
        {
          getUrl: (target) => `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`,
          parse: async (res) => (await res.json()).contents
        },
        {
          getUrl: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`,
          parse: async (res) => await res.text()
        }
      ];
    
      for (const proxy of proxyServices) {
        try {
          const res = await fetch(proxy.getUrl(url), { signal: AbortSignal.timeout(8000) });
          if (!res.ok) continue;
          const rawHtml = await proxy.parse(res);
          if (rawHtml && rawHtml.trim().length > 0) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            doc.querySelectorAll('script, style, nav, footer, header').forEach(el => el.remove());
            return `Inhalt von URL (${url}):\n` + (doc.body.textContent || "").replace(/\s+/g, ' ').trim().substring(0, 4000);
          }
        } catch (err) {}
      }

      return `Fehler: Konnte URL '${url}' weder direkt noch über Proxies laden (CORS-Beschränkung oder Timeout).`;
    }

    async function perform_search_doc(args = {}) {
      const params = typeof args === 'string' ? { query: args } : (args || {});
      const query = (params.query || params.search || params.term || '').trim();
      if (!query) {
        return "Fehler: Kein Suchbegriff ('query') angegeben.";
      }
    
      const docIdentifier = params.document_id || params.id || params.name;
      const caseSensitive = params.case_sensitive === true || params.case_sensitive === "true";
      const maxResults = parseInt(params.max_results || params.limit) || 10;
    
      let candidateDocs = [];
      if (docIdentifier) {
        let targetDoc = null;
        for (const [id, doc] of Object.entries(uploadedDocs)) {

            targetDoc = doc;
            break;
          }
        }
        if (!targetDoc) {
          return `Fehler: Dokument '${docIdentifier}' nicht gefunden. Verfügbare Dokumente: ` +
            Object.values(uploadedDocs).map(d => `${d.name} (${d.id})`).join(', ');
        }
        if (targetDoc.isImage) {
          return `Dokument '${targetDoc.name}' ist eine Bilddatei und kann nicht durchsucht werden.`;
        }
        candidateDocs.push(targetDoc);
      } else {
        candidateDocs = Object.values(uploadedDocs).filter(d => !d.isImage && typeof d.content === 'string');
      }

      if (candidateDocs.length === 0) {
        return "Keine durchsuchbaren Dokumente vorhanden.";
      }

      const normalizedQuery = caseSensitive ? query : query.toLowerCase();
      const matches = [];
    
      for (const doc of candidateDocs) {
        const rawContent = doc.content || "";
        const hasPages = rawContent.includes("--- Seite ");
    
        const sections = [];
        if (hasPages) {
          const parts = rawContent.split(/--- Seite (\d+) ---/);
          for (let i = 1; i < parts.length; i += 2) {
            sections.push({
              page: parseInt(parts[i], 10),
              text: parts[i + 1] || ""
            });
          }
        } else {
          sections.push({ page: 1, text: rawContent });
        }
    
        for (const sec of sections) {

const DEFAULT_CONFIG = {
  concurrency: 3,
  maxUnitsPerCall: 40,
  requestTimeoutMs: 120_000,
  maxContextChars: 6_000,
  maxDocumentChars: 45_000
};

function normalizeAnalysisUnit(rawUnit) {
  const val = (rawUnit || "page").toString().toLowerCase().trim();
  if (["line", "lines", "line-by-line", "line_by_line", "zeile", "zeilen", "zeilenweise"].includes(val)) {
    return "line";
  }
  if (["document", "whole", "whole_document", "full", "all", "gesamt", "gesamtdokument", "ganzes"].includes(val)) {
    return "document";
  }
  return "page";
}

function normalizeCategories(rawCategories) {
  if (!Array.isArray(rawCategories)) return [];
  return rawCategories
    .map((c) => (typeof c === "string" ? c.trim() : ""))
    .filter(Boolean);
}

function formatCategoriesBlock(categories) {
  if (!categories || categories.length === 0) return "";
  return [
    "Vorgegebene Kategorien / Dimensionen (prioritär verwenden, falls passend):",
    ...categories.map((cat, idx) => `${idx + 1}. ${cat}`)
  ].join("\n");
}

function truncateText(text, maxChars) {
  const clean = (text || "").trim();
  if (!maxChars || clean.length <= maxChars) {
    return { text: clean, truncated: false };
  }
  return {
    text: `${clean.slice(0, maxChars)}\n\n[... gekürzt wegen Zeichenlimit (${clean.length} Zeichen gesamt) ...]`,
    truncated: true
  };
}

function parseBoundedRange(startVal, endVal, minVal, maxVal, label) {
  const hasStart = startVal !== undefined && startVal !== null && startVal !== "";
  const hasEnd = endVal !== undefined && endVal !== null && endVal !== "";

  let start = hasStart ? Number.parseInt(startVal, 10) : minVal;
  let end = hasEnd ? Number.parseInt(endVal, 10) : maxVal;

  if (Number.isNaN(start)) start = minVal;
  if (Number.isNaN(end)) end = maxVal;

  if (start > end) {
    return {
      error: `Ungültiger ${label}-Bereich: Start (${start}) ist größer als Ende (${end}).`
    };
  }

  return {
    start: Math.max(minVal, Math.min(maxVal, start)),
    end: Math.max(minVal, Math.min(maxVal, end))
  };
}

async function runWithConcurrency(items, concurrency, workerFn) {
  const results = new Array(items.length);
  let nextIndex = 0;

  async function worker() {
    while (nextIndex < items.length) {
      const idx = nextIndex++;
      results[idx] = await workerFn(items[idx], idx);
    }
  }

  const count = Math.max(1, Math.min(concurrency, items.length));
  await Promise.all(Array.from({ length: count }, () => worker()));
  return results;
}
