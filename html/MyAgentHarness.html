    async function handleSend() {
      const inputElem = document.getElementById('user-input');
      const text = inputElem.value.trim();
      if (!text) return;

      chatHistorySnapshotBeforeSend = JSON.parse(JSON.stringify(chatHistory));
      isCancelled = false;

      let messageContent = text;
      const imageParts = [];
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (doc.isImage && doc.selected !== false) {
          imageParts.push({ type: "image_url", image_url: { url: doc.content } });
        }
      }

      if (imageParts.length > 0) {
        messageContent = [{ type: "text", text: text }, ...imageParts];
      }

      const msgIndex = chatHistory.length;
      appendMessageUI('user', text, null, msgIndex);
      chatHistory.push({ role: 'user', content: messageContent });
      inputElem.value = '';
      
      setInputsDisabled(true);
      document.getElementById('cancel-btn').style.display = 'inline-block';

      updateContextUsageDisplay();
      saveStateToLocalStorage();
      await runAgentLoop();
    }

    function cancelAgent() {
      isCancelled = true;
      if (currentAbortController) {
        currentAbortController.abort();
      }
      if (chatHistorySnapshotBeforeSend) {
        chatHistory = chatHistorySnapshotBeforeSend;
      }
      activeFrozenSystemPrompt = null;
      appendMessageUI('system-info', 'Agenten-Anfrage und Tool-Calls wurden abgebrochen.');
      
      setInputsDisabled(false);
      document.getElementById('cancel-btn').style.display = 'none';
      updateContextUsageDisplay();
      rebuildChatUI();
      saveStateToLocalStorage();
    }

    async function runAgentLoop(isFirstCall = false) {
      if (isCancelled) return;

      let endpoint = document.getElementById('endpoint').value.trim();
      
      endpoint = endpoint.replace(/\/chat\/completion\b/g, '/chat/completions');
      endpoint = endpoint.replace(/\/chat\/completions\/chat\/completions/g, '/chat/completions');
      
      if (!endpoint.includes('/chat/completions')) {
        let baseUrl = endpoint.includes('/v1/') ? endpoint.split('/v1/')[0] + '/v1' : endpoint.replace(/\/+$/, '');
        endpoint = `${baseUrl}/chat/completions`;
        document.getElementById('endpoint').value = endpoint;
      }

      const modelVal = document.getElementById('model-name').value;
      const maxContextTokens = parseInt(document.getElementById('max-context').value) === NaN ? 4096 : parseInt(document.getElementById('max-context').value);
      
      if (activeFrozenSystemPrompt === null) {
        activeFrozenSystemPrompt = getCompleteSystemPrompt();
      }

      let messages = [{ role: "system", content: activeFrozenSystemPrompt }, ...chatHistory];
      
      await handleContextOverflow(messages, maxContextTokens, modelVal, endpoint);
      if (isCancelled) return;

      chatHistory = messages.filter(m => m.role !== 'system');

      updateContextUsageDisplay();
      saveStateToLocalStorage();

      const tools = getAvailableToolsSchema();
      const currentPayloadMessages = [{ role: "system", content: activeFrozenSystemPrompt }, ...chatHistory];
      const payload = { model: modelVal, messages: currentPayloadMessages, temperature: 0.2, stream: true };
      if (tools.length > 0) { payload.tools = tools; payload.tool_choice = "auto"; }

      try {
        currentAbortController = new AbortController();
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: currentAbortController.signal
        });

        if (!response.ok) {
          let errorBody = "";
          try { errorBody = await response.text(); } catch(e) {}
          throw new Error(`HTTP Fehler ${response.status}: ${errorBody || response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        let accumulatedContent = "";
        let toolCallMap = {}; 
        let rawStreamChunks = [];
        let assistantDiv = null;
        let streamedSuccessfully = false;
        const msgIndex = chatHistory.length;

        while (true) {
          if (isCancelled) {
            reader.cancel();
            return;
          }
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          rawStreamChunks.push(chunk);
          const lines = chunk.split("\n");

          for (let line of lines) {
            line = line.trim();
            if (!line.startsWith("data:")) continue;
            const dataStr = line.replace(/^data:\s*/, "");
            if (dataStr === "[DONE]") continue;

            try {
              const parsed = JSON.parse(dataStr);
              if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta) {
                const delta = parsed.choices[0].delta;
                if (delta.content) {
                  if (!streamedSuccessfully) {
                    assistantDiv = createStreamingMessageContainer('assistant', msgIndex);
                    streamedSuccessfully = true;
                  }
                  accumulatedContent += delta.content;
                  updateStreamingMessageContent(assistantDiv, accumulatedContent);
                }
                if (delta.tool_calls) {
                  for (const tcDelta of delta.tool_calls) {
                    const idx = tcDelta.index;
                    if (!toolCallMap[idx]) toolCallMap[idx] = { id: "", type: "function", function: { name: "", arguments: "" } };
                    if (tcDelta.id) toolCallMap[idx].id = tcDelta.id;
                    if (tcDelta.function) {
                      if (tcDelta.function.name) toolCallMap[idx].function.name += tcDelta.function.name;
                      if (tcDelta.function.arguments) toolCallMap[idx].function.arguments += tcDelta.function.arguments;
                    }
                  }
                }
              }
            } catch (err) {}
          }
        }

        if (isCancelled) return;

        const accumulatedToolCalls = Object.values(toolCallMap);
        if (!streamedSuccessfully && accumulatedContent === "" && accumulatedToolCalls.length === 0) {
          const fullText = rawStreamChunks.join("");
          try {
            const data = JSON.parse(fullText);
            const choice = data.choices[0].message;
            accumulatedContent = choice.content || "";
            if (choice.tool_calls) accumulatedToolCalls.push(...choice.tool_calls);
          } catch(e) {
            throw new Error('Der LLM-Server hat keine gültigen Stream-Daten zurückgegeben.');
          }
        }

        const stepPayload = { model: modelVal, messages: currentPayloadMessages, temperature: 0.2 };
        if (tools.length > 0) stepPayload.tools = tools;
        const fullResponseContext = { request_payload: stepPayload, raw_stream_chunks: rawStreamChunks };

        if (accumulatedToolCalls.length === 0) {
          if (!streamedSuccessfully && accumulatedContent) appendMessageUI('assistant', accumulatedContent, fullResponseContext, msgIndex);
          else if (assistantDiv) appendDetailsToAssistant(assistantDiv, fullResponseContext);
          chatHistory.push({ role: 'assistant', content: accumulatedContent });
          
          activeFrozenSystemPrompt = null;
          setInputsDisabled(false);
          document.getElementById('cancel-btn').style.display = 'none';

          updateContextUsageDisplay();
          saveStateToLocalStorage();
          return;
        }

        const assistantMsgObj = { role: 'assistant', content: accumulatedContent || null, tool_calls: accumulatedToolCalls };
        chatHistory.push(assistantMsgObj);
        updateContextUsageDisplay();
        saveStateToLocalStorage();

        if (streamedSuccessfully && assistantDiv) appendDetailsToAssistant(assistantDiv, fullResponseContext);
        else if (accumulatedContent) appendMessageUI('assistant', accumulatedContent, fullResponseContext, msgIndex);

        for (const call of accumulatedToolCalls) {
          if (isCancelled) return;
          await processToolCall(call);
        }

        if (!isCancelled) {
          await runAgentLoop();
        }

      } catch (err) {
        if (!isCancelled) {
          appendMessageUI('system-info', `Fehler: ${err.message}`);
          activeFrozenSystemPrompt = null;
          setInputsDisabled(false);
          document.getElementById('cancel-btn').style.display = 'none';
        }
      }
    }

    async function processToolCall(call) {
      if (isCancelled) return;
      const name = call.function.name;
      let args;
      try { args = JSON.parse(call.function.arguments || "{}"); } catch(e) { args = {}; }
      const callId = call.id || "call_" + Math.random().toString(36).substr(2, 9);
      const requireApproval = document.getElementById('require-approval').checked;

      let res;
      let executedArgs = args; 
      
      const executeFn = async (currentArgs) => {
        switch (name) {
          case 'read_doc': return await performReadDoc(currentArgs);
          case 'write_doc': return performWriteDoc(currentArgs);
          case 'search_web': return await performsearch_web(currentArgs.query);
          case 'fetch_url': return await performfetch_url(currentArgs.url || currentArgs.query);
          case 'search_wikipedia': return await performsearch_wikipedia(currentArgs.query);
          case 'get_weather': return await performget_weather(currentArgs.location || currentArgs.query);
          case 'calculate': return await performcalculate(currentArgs.expression || currentArgs.query);
          case 'run_code': return performrun_code(currentArgs.code || currentArgs.query);
          case 'generate_image': return await performgenerate_image(currentArgs.prompt || currentArgs.query);
          default: return "Unbekanntes Tool";
        }
      };

      if (requireApproval) {
        res = await new Promise((resolve) => {
          renderApprovalUI(callId, name, args, async (approved, editedArgs) => {
            if (isCancelled) { resolve("Vom Nutzer abgebrochen."); return; }
            if (approved) {
              executedArgs = editedArgs;
              call.function.arguments = JSON.stringify(editedArgs);
              resolve(await executeFn(editedArgs));
            } else {
              resolve("Vom Nutzer abgelehnt.");
            }
          });
        });
      } else {
        res = await executeFn(args);
      }

      if (isCancelled) return;

      renderToolResultUI(callId, name, executedArgs, res);
      chatHistory.push({ role: "tool", tool_call_id: callId, content: typeof res === 'string' ? res : JSON.stringify(res) });
      updateContextUsageDisplay();
      saveStateToLocalStorage();
    }

    function appendMessageUI(role, text, responseData = null, messageIndex = null) {
      const container = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;
      if (messageIndex !== null) wrapper.setAttribute('data-index', messageIndex);

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant') {
        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') div.innerHTML = marked.parse(text || '');
        else div.innerText = text || '';
      } else {
        div.innerText = text;
      }
      wrapper.appendChild(div);

      if (role === 'user' || role === 'assistant') {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'msg-action-btn';
        editBtn.innerHTML = '✎';
        editBtn.title = 'Bearbeiten';
        editBtn.onclick = () => openMessageEditModal(messageIndex);
        actionsDiv.appendChild(editBtn);

        // Wiederholen-Button nun auch für User-Messages (sowie weiterhin für Assistant-Messages)
        const repeatBtn = document.createElement('button');
        repeatBtn.className = 'msg-action-btn';
        repeatBtn.innerHTML = '↻';
        repeatBtn.title = 'Wiederholen';
        repeatBtn.onclick = () => repeatMessage(messageIndex);
        actionsDiv.appendChild(repeatBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'msg-action-btn btn-del-msg';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Löschen';
        delBtn.onclick = () => deleteMessageAndFollowing(messageIndex);
        actionsDiv.appendChild(delBtn);

        wrapper.appendChild(actionsDiv);
      }

      container.appendChild(wrapper);
      if (role === 'assistant' && responseData) appendDetailsToAssistant(div, responseData);
      container.scrollTop = container.scrollHeight;
    }

    function createStreamingMessageContainer(role, messageIndex) {
      const container = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;
      if (messageIndex !== null) wrapper.setAttribute('data-index', messageIndex);

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      wrapper.appendChild(div);

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'msg-action-btn';
      editBtn.innerHTML = '✎';
      editBtn.title = 'Bearbeiten';
      editBtn.onclick = () => openMessageEditModal(messageIndex);
      actionsDiv.appendChild(editBtn);

      const repeatBtn = document.createElement('button');
      repeatBtn.className = 'msg-action-btn';
      repeatBtn.innerHTML = '↻';
      repeatBtn.title = 'Wiederholen';
      repeatBtn.onclick = () => repeatMessage(messageIndex);
      actionsDiv.appendChild(repeatBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'msg-action-btn btn-del-msg';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Löschen';
      delBtn.onclick = () => deleteMessageAndFollowing(messageIndex);
      actionsDiv.appendChild(delBtn);

      wrapper.appendChild(actionsDiv);
      container.appendChild(wrapper);
      return div;
    }

    function updateStreamingMessageContent(div, text) {
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') div.innerHTML = marked.parse(text || '');
      else div.innerText = text || '';
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    function appendDetailsToAssistant(msgDiv, responseData) {
      const details = document.createElement('details');
      details.style.cssText = 'font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; border-top: 1px solid var(--border); paddingTop: 4px; width: 100%; box-sizing: border-box;';
      details.innerHTML = `
        <summary style="cursor: pointer; user-select: none;">Details</summary>
        <pre style="background: #181825; padding: 6px; border-radius: 4px; height: 220px; width: 100%; overflow: auto; word-break: break-all; margin-top: 4px; color: var(--accent); font-family: monospace;">${JSON.stringify(responseData, null, 2)}</pre>
      `;
      msgDiv.appendChild(details);
    }

    function renderToolResultUI(callId, name, args, result) {
      const container = document.getElementById('chat-messages');
      const card = document.createElement('div');
      card.className = 'tool-call-card';
      card.innerHTML = `
        <header>🛠️ Tool Executed: ${name}</header>
        <div class="args">Input: ${JSON.stringify(args)}</div>
        <div class="result">${typeof result === 'object' ? JSON.stringify(result, null, 2) : result}</div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    function renderApprovalUI(callId, name, args, callback) {
      const container = document.getElementById('chat-messages');
      const card = document.createElement('div');
      card.className = 'tool-call-card';
      card.style.borderColor = 'var(--warning)';
      const argsString = JSON.stringify(args, null, 2);
      card.innerHTML = `
        <header style="color: var(--warning);">⚠️ Tool-Freigabe erforderlich: ${name}</header>
        <div style="margin-bottom: 6px; font-size: 0.75rem; color: var(--text-muted);">Parameter editierbar:</div>
        <textarea id="args-edit-${callId}" rows="4" style="width: 100%; margin-bottom: 6px; font-family: monospace;">${argsString}</textarea>
        <div class="approval-banner">
          <span>Ausführen?</span>
          <div>
            <button class="approval-btn" id="approve-${callId}">Freigeben</button>
            <button class="deny-btn" id="deny-${callId}">Ablehnen</button>
          </div>
        </div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;

      document.getElementById(`approve-${callId}`).onclick = () => {
        const editedText = document.getElementById(`args-edit-${callId}`).value;
        let finalArgs = args;
        try { finalArgs = JSON.parse(editedText); } catch (e) { alert("JSON-Fehler, nutze Original-Parameter."); }
        card.remove(); 
        callback(true, finalArgs); 
      };
      document.getElementById(`deny-${callId}`).onclick = () => { card.remove(); callback(false, args); };
    }

    function setInputsDisabled(disabled) {
      document.getElementById('send-btn').disabled = disabled;
      document.getElementById('user-input').disabled = disabled;
    }

    function deleteMessageAndFollowing(index) {
      if (!confirm("Diese Nachricht und alle folgenden Nachrichten wirklich löschen?")) return;
      chatHistory = chatHistory.slice(0, index);
      rebuildChatUI();
      updateContextUsageDisplay();
      saveStateToLocalStorage();
    }

    function repeatMessage(index) {
      const msg = chatHistory[index];
      if (!msg) return;
      
      if (msg.role === 'assistant') {
        chatHistory = chatHistory.slice(0, index);
      } else if (msg.role === 'user') {
        chatHistory = chatHistory.slice(0, index);
      }
      rebuildChatUI();
      updateContextUsageDisplay();
      saveStateToLocalStorage();

      if (msg.role === 'user') {
        let textContent = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '');
        const msgIndex = chatHistory.length;
        appendMessageUI('user', textContent, null, msgIndex);
        chatHistory.push(msg);
        setInputsDisabled(true);
        document.getElementById('cancel-btn').style.display = 'inline-block';
        runAgentLoop();
      } else {
        setInputsDisabled(true);
        document.getElementById('cancel-btn').style.display = 'inline-block';
        runAgentLoop();
      }
    }

    function openMessageEditModal(index) {
      const msg = chatHistory[index];
      if (!msg) return;
      currentEditingIndex = index;
      let currentText = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '');
      
      document.getElementById('msg-edit-textarea').value = currentText;
      document.getElementById('msg-edit-modal').style.display = 'flex';
    }

    function closeMessageEditModal() {
      document.getElementById('msg-edit-modal').style.display = 'none';
      currentEditingIndex = null;
    }

    function saveMessageEdit() {
          if (currentEditingIndex === null) return;
          const index = currentEditingIndex;
          const msg = chatHistory[index];
          if (!msg) return;
          
          const newText = document.getElementById('msg-edit-textarea').value;
          
          if (typeof msg.content === 'string') {
            msg.content = newText;
          } else if (Array.isArray(msg.content)) {
            let textPart = msg.content.find(c => c.type === 'text');
            if (textPart) textPart.text = newText;
            else msg.content.unshift({ type: "text", text: newText });
          }
    
          rebuildChatUI();
          updateContextUsageDisplay();
          saveStateToLocalStorage();
          closeMessageEditModal();
          
          if (msg.role === 'user') {
            setInputsDisabled(true);
            document.getElementById('cancel-btn').style.display = 'inline-block';
            runAgentLoop();
          }
      }

    function rebuildChatUI() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '<div class="msg-wrapper system-info"><div class="msg system-info">Chat-History aktualisiert.</div></div>';
      
      const getToolResultText = (toolCallId) => {
        const found = chatHistory.find(m => m.role === 'tool' && m.tool_call_id === toolCallId);
        return found ? found.content : '[Ergebnis nicht verfügbar]';
      };

      for (let i = 0; i < chatHistory.length; i++) {
        const msg = chatHistory[i];
        if (msg.role === 'user') {
          let displayTxt = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '[Multimodale Nachricht]');
          appendMessageUI('user', displayTxt, null, i);
        } else if (msg.role === 'assistant') {
          if (msg.content) appendMessageUI('assistant', msg.content, null, i);
          if (msg.tool_calls && Array.isArray(msg.tool_calls)) {
            for (const tc of msg.tool_calls) {
              let argsParsed = {};
              try { argsParsed = JSON.parse(tc.function.arguments); } catch(e){}
              const resText = getToolResultText(tc.id);
              renderToolResultUI(tc.id, tc.function.name, argsParsed, resText);
            }
          }
        }
      }
    }

    updateMaxContextFromEndpoint(); 
    saveStateToLocalStorage();
  </script>
</body>
</html>
