function buildUnitsForDocument(targetDoc, unitType, params, overlapCount) {
  const rawContent = targetDoc.content || "";

  if (unitType === "document") {
    const cleanedFullText = rawContent.replace(/--- Seite \d+ ---/g, "").trim() || rawContent;
    return {
      unitLabel: "Dokument",
      scopeSummary: "Gesamtes Dokument als Ganzes",
      units: [
        {
          id: "doc-full",
          labelNum: "Gesamtdokument",
          text: cleanedFullText,
          prevText: "",
          nextText: ""
        }
      ]
    };
  }

  if (unitType === "line") {
    const lines = rawContent.split(/\r?\n/).map((lineText, index) => ({
      lineNum: index + 1,
      text: lineText
    }));
    if (lines.length === 0) {
      lines.push({ lineNum: 1, text: "" });
    }

    const minLine = lines[0].lineNum;
    const maxLine = lines[lines.length - 1].lineNum;
    const range = parseBoundedRange(params.start_line, params.end_line, minLine, maxLine, "Zeilen");
    if (range.error) {
      return { error: range.error };
    }

    const filtered = lines
      .map((item, idx) => ({ item, idx }))
      .filter(({ item }) => item.lineNum >= range.start && item.lineNum <= range.end);

    if (filtered.length === 0) {
      return {
        error: `Keine Zeilen im Bereich ${range.start}-${range.end} für Dokument '${targetDoc.name}' gefunden.`
      };
    }

    const units = filtered.map(({ item, idx }) => {
      const prevSlice =
        overlapCount > 0 ? lines.slice(Math.max(0, idx - overlapCount), idx) : [];
      const nextSlice =
        overlapCount > 0
          ? lines.slice(idx + 1, Math.min(lines.length, idx + 1 + overlapCount))
          : [];

      return {
        id: `line-${item.lineNum}`,
        labelNum: String(item.lineNum),
        text: item.text,
        prevText: prevSlice.map((x) => `Zeile ${x.lineNum}: ${x.text}`).join("\n"),
        nextText: nextSlice.map((x) => `Zeile ${x.lineNum}: ${x.text}`).join("\n")
      };
    });

    return {
      unitLabel: "Zeile",
      scopeSummary: `Zeilen ${range.start}–${range.end} (Overlap: ${overlapCount})`,
      units
    };
  }

  // Standard: 'page'
  const pages = [];
  if (rawContent.includes("--- Seite ")) {
    const parts = rawContent.split(/--- Seite (\d+) ---/);
    for (let i = 1; i < parts.length; i += 2) {
      pages.push({
        pageNum: Number.parseInt(parts[i], 10),
        text: parts[i + 1] || ""
      });
    }
  }
  if (pages.length === 0) {
    pages.push({ pageNum: 1, text: rawContent });
  }

  const minPage = pages[0].pageNum;
  const maxPage = pages[pages.length - 1].pageNum;
  const range = parseBoundedRange(params.start_page, params.end_page, minPage, maxPage, "Seiten");
  if (range.error) {
    return { error: range.error };
  }

  const selected = pages
    .map((p, idx) => ({ p, idx }))
    .filter(({ p }) => p.pageNum >= range.start && p.pageNum <= range.end);

  if (selected.length === 0) {
    return {
      error: `Keine Seiten im Bereich ${range.start}-${range.end} für Dokument '${targetDoc.name}' gefunden.`
    };
  }

  const units = selected.map(({ p, idx }) => {
    const prevSlice =
      overlapCount > 0 ? pages.slice(Math.max(0, idx - overlapCount), idx) : [];
    const nextSlice =
      overlapCount > 0
        ? pages.slice(idx + 1, Math.min(pages.length, idx + 1 + overlapCount))
        : [];

    return {
      id: `page-${p.pageNum}`,
      labelNum: String(p.pageNum),
      text: p.text,
      prevText: prevSlice.map((x) => `--- Seite ${x.pageNum} ---\n${x.text.trim()}`).join("\n\n"),
      nextText: nextSlice.map((x) => `--- Seite ${x.pageNum} ---\n${x.text.trim()}`).join("\n\n")
    };
  });

  return {
    unitLabel: "Seite",
    scopeSummary: `Seiten ${range.start}–${range.end} (Overlap: ${overlapCount})`,
    units
  };
}

async function callChatCompletion({
  chatUrl,
  model,
  apiKey,
  systemPrompt,
  userPrompt,
  temperature = 0.2,
  maxTokens = 1000,
  timeoutMs = DEFAULT_CONFIG.requestTimeoutMs,
  signal
}) {
  const controller = new AbortController();
  const onAbort = () => controller.abort();
  if (signal) {
    if (signal.aborted) controller.abort();
    else signal.addEventListener("abort", onAbort, { once: true });
  }
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const res = await fetch(chatUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(apiKey ? { Authorization: `Bearer ${apiKey}` } : {})
      },
      signal: controller.signal,
      body: JSON.stringify({
        model,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ],
        temperature,
        max_tokens: maxTokens
      })
    });

    if (!res.ok) {
      const errBody = await res.text().catch(() => "");
      return {
        ok: false,
        status: `http_error_${res.status}`,
        error: `HTTP ${res.status}${errBody ? `: ${errBody.slice(0, 200)}` : ""}`,
        content: "",
        finishReason: null
      };
    }

    const data = await res.json();
    const choice = data.choices?.[0];
    const content = (choice?.message?.content || "").trim();
    const finishReason = choice?.finish_reason || null;

    if (!content) {
      return {
        ok: false,
        status: "empty_response",
        error: "Leere Antwort vom Modell erhalten.",
        content: "",
        finishReason
      };
    }

    return {
      ok: true,
      status: finishReason === "length" ? "truncated" : "ok",
      error: finishReason === "length" ? "Antwort durch max_tokens gekürzt." : null,
      content,
      finishReason
    };
  } catch (err) {
    return {
      ok: false,
      status: err.name === "AbortError" ? "timeout_or_aborted" : "network_error",
      error: err.message || String(err),
      content: "",
      finishReason: null
    };
  } finally {
    clearTimeout(timeoutId);
    if (signal) signal.removeEventListener("abort", onAbort);
  }
}

async function synthesizeUnitResults({
  chatUrl,
  model,
  apiKey,
  doc,
  researchQuestion,
  technique,
  categories,
  unitLabel,
  unitResults,
  timeoutMs,
  signal
}) {
  const validResults = unitResults.filter((r) => r.ok && r.analysis);
  if (validResults.length === 0) {
    return {
      ok: false,
      status: "no_valid_units",
      error: "Keine erfolgreichen Einzelergebnisse für eine Synthese vorhanden.",
      synthesis: ""
    };
  }

  const combinedInput = validResults
    .map((r) => `### ${unitLabel} ${r.unit}\n${r.analysis}`)
    .join("\n\n");

  const { text: boundedInput } = truncateText(combinedInput, DEFAULT_CONFIG.maxDocumentChars);
  const categoriesBlock = formatCategoriesBlock(categories);

  const systemPrompt = [
    "Du bist ein Assistent für qualitative Inhaltsanalyse nach Fischer (2025).",
    "Verdichte die vorliegenden Einzelergebnisse zu einer übergreifenden, widerspruchsfreien Synthese.",
    "Bleibe streng bei den belegten Aussagen der Einzelergebnisse und benenne übergreifende Muster, Unterschiede sowie offene Punkte."
  ].join("\n");

  const userPrompt = [
    `Dokument: "${doc.name}" (${doc.title || doc.name})`,
    `Forschungsfrage:\n${researchQuestion}`,
    `Analysetechnik: ${technique}`,
    categoriesBlock ? `\n${categoriesBlock}` : "",
    `\nEinzelergebnisse (${validResults.length} von ${unitResults.length} Einheiten):\n${boundedInput}`
  ]
    .filter(Boolean)
    .join("\n\n");

  const res = await callChatCompletion({
    chatUrl,
    model,
    apiKey,
    systemPrompt,
    userPrompt,
    temperature: 0.2,
    maxTokens: 1800,
    timeoutMs,
    signal
  });

  return {
    ok: res.ok,
    status: res.status,
    error: res.error,
    synthesis: res.content
  };
}

function formatAnalysisMarkdown(report) {
  const lines = [
    `# Qualitative Inhaltsanalyse: ${report.document.name} (${report.document.id})`,
    `- **Forschungsfrage:** ${report.research_question}`,
    `- **Analysetechnik:** ${report.technique}`,
    `- **Verarbeitungseinheit:** ${report.unit_type} (${report.scope_summary})`,
    `- **Kategorienvorgabe:** ${report.categories.length ? report.categories.join(", ") : "Keine"}`,
    `- **Eigenes Prompt-Template:** ${report.has_custom_template ? "Ja" : "Nein"}`,
    `- **Statusübersicht:** ${report.stats.ok} ok, ${report.stats.truncated} gekürzt, ${report.stats.failed} fehlgeschlagen (Cache-Treffer: ${report.stats.cached})`,
    ""
  ];

  for (const item of report.results) {
    const badge =
      item.status === "ok"
        ? ""
        : item.status === "truncated"
        ? " *(gekürzt)*"
        : ` *(Fehler: ${item.error || item.status})*`;
    lines.push(`### ${report.unit_label} ${item.unit}${badge}`);
    lines.push(item.analysis || `Fehler bei der Analyse: ${item.error || item.status}`);
    lines.push("");
  }

  if (report.synthesis) {
    lines.push("## Übergreifende Synthese");
    lines.push(report.synthesis);
    lines.push("");
  }

  return lines.join("\n").trim();
}

async function perform_run_content_analysis(args = {}, context = {}) {
  const params = typeof args === "string" ? { research_question: args } : args || {};
  const docIdentifier = params.document_id || params.id || params.name;
  const researchQuestion = (params.research_question || params.question || "").trim();
  const technique = (params.technique || params.analysis_technique || params.method || "summarize")
    .toLowerCase()
    .trim();
  const unitType = normalizeAnalysisUnit(params.unit || params.processing_unit || params.granularity);
  const categories = normalizeCategories(params.categories);
  const dryRun = Boolean(params.dry_run);
  const synthesize = Boolean(params.synthesize);
  const promptTemplate =
    typeof params.prompt_template === "string"
      ? params.prompt_template
      : typeof params.custom_prompt === "string"
      ? params.custom_prompt
      : "";

  const validTechniques = ["summarize", "explicate", "annotate", "induce"];
  if (!validTechniques.includes(technique)) {
    return {
      ok: false,
      error: `Ungültige Analysetechnik '${technique}'. Erlaubt sind: ${validTechniques.join(", ")}.`,
      markdown: `Fehler: Ungültige Analysetechnik '${technique}'. Erlaubt sind: ${validTechniques.join(", ")}.`
    };
  }

  if (!researchQuestion) {
    return {
      ok: false,
      error: "Es wurde keine 'research_question' angegeben.",
      markdown: "Fehler: Es wurde keine 'research_question' angegeben."
    };
  }

  const docsMap = context.uploadedDocs || (typeof uploadedDocs !== "undefined" ? uploadedDocs : {});
  let targetDoc = null;

  if (docIdentifier) {
    for (const [id, doc] of Object.entries(docsMap)) {
      if (id === docIdentifier || doc.name === docIdentifier) {
        targetDoc = doc;
        break;
      }
    }
  } else {
    const docList = Object.values(docsMap);
    targetDoc =
      docList.find((d) => !d.isImage && d.selected !== false) ||
      docList.find((d) => !d.isImage) ||
      null;
  }

  if (!targetDoc) {
    const msg = docIdentifier
      ? `Dokument '${docIdentifier}' nicht gefunden.`
      : "Kein geeignetes Dokument für die Inhaltsanalyse gefunden.";
    return { ok: false, error: msg, markdown: `Fehler: ${msg}` };
  }

  if (targetDoc.isImage) {
    const msg = `Dokument '${targetDoc.name}' ist eine Bilddatei und wird nicht als Text unterstützt.`;
    return { ok: false, error: msg, markdown: `Fehler: ${msg}` };
  }

  const defaultOverlap = unitType === "document" ? 0 : 1;
  const hasExplicitOverlap = params.overlap !== undefined && params.overlap !== null && params.overlap !== "";
  const parsedOverlap = hasExplicitOverlap ? Number.parseInt(params.overlap, 10) : defaultOverlap;
  const overlapCount = Number.isNaN(parsedOverlap) ? defaultOverlap : Math.max(0, parsedOverlap);

  const built = buildUnitsForDocument(targetDoc, unitType, params, overlapCount);
  if (built.error) {
    return { ok: false, error: built.error, markdown: `Fehler: ${built.error}` };
  }

  const maxUnits =
    params.max_units !== undefined && params.max_units !== null
      ? Math.max(1, Number.parseInt(params.max_units, 10) || DEFAULT_CONFIG.maxUnitsPerCall)
      : context.maxUnitsPerCall || DEFAULT_CONFIG.maxUnitsPerCall;

  if (built.units.length > maxUnits && !dryRun) {
    const msg = `Zu viele Einheiten (${built.units.length} > Limit ${maxUnits}). Nutze start_page/end_page, start_line/end_line, unit='document', dry_run=true oder ein höheres max_units.`;
    return { ok: false, error: msg, markdown: `Fehler: ${msg}` };
  }

  if (dryRun) {
    const totalChars = built.units.reduce((sum, u) => sum + (u.text || "").length, 0);
    const totalWords = built.units.reduce(
      (sum, u) => sum + ((u.text || "").trim().match(/\S+/g) || []).length,
      0
    );
    const estimatedTokensInput = Math.ceil((totalChars * (1 + overlapCount * 0.6)) / 4);
    const estimatedTokensOutput =
      built.units.length * (unitType === "document" ? 1600 : 800) + (synthesize ? 1500 : 0);

    const dryRunReport = {
      ok: true,
      dry_run: true,
      document: { id: targetDoc.id, name: targetDoc.name, title: targetDoc.title || targetDoc.name },
      research_question: researchQuestion,
      technique,
      unit_type: unitType,
      unit_label: built.unitLabel,
      scope_summary: built.scopeSummary,
      unit_count: built.units.length,
      exceeds_default_max_units: built.units.length > maxUnits,
      max_units_limit: maxUnits,
      categories,
      synthesize,
      stats: {
        characters: totalChars,
        words: totalWords,
        estimated_input_tokens: estimatedTokensInput,
        estimated_output_tokens: estimatedTokensOutput
      }
    };

    dryRunReport.markdown = [
      `# Dry-Run: Qualitative Inhaltsanalyse (${targetDoc.name})`,
      `- **Forschungsfrage:** ${researchQuestion}`,
      `- **Analysetechnik:** ${technique}`,
      `- **Bereich:** ${built.scope_summary}`,
      `- **Anzahl Einheiten:** ${built.units.length} (Limit: ${maxUnits})`,
      `- **Umfang:** ${totalWords} Wörter / ${totalChars} Zeichen`,
      `- **Geschätzte Tokens:** ~${estimatedTokensInput} Input / ~${estimatedTokensOutput} Output`,
      `- **Synthese geplant:** ${synthesize ? "Ja" : "Nein"}`
    ].join("\n");

    return dryRunReport;
  }

  const endpoint = (
    context.endpoint ||
    (typeof document !== "undefined" ? document.getElementById("endpoint")?.value?.trim() : "") ||
    ""
  ).trim();
  const modelVal =
    context.model ||
    (typeof document !== "undefined" ? document.getElementById("model-name")?.value || "" : "");
  const apiKey = context.apiKey || "";

  if (!endpoint) {
    return {
      ok: false,
      error: "Kein LLM-Endpoint konfiguriert.",
      markdown: "Fehler: Kein LLM-Endpoint konfiguriert."
    };
  }

  const chatUrl = endpoint.includes("/chat/completions")
    ? endpoint
    : `${endpoint.replace(/\/+$/, "")}/v1/chat/completions`;

  const docVersion = targetDoc.updatedAt || targetDoc.hash || `${(targetDoc.content || "").length}`;
  const concurrency = context.concurrency || DEFAULT_CONFIG.concurrency;
  const timeoutMs = context.requestTimeoutMs || DEFAULT_CONFIG.requestTimeoutMs;
  const maxContextChars = context.maxContextChars || DEFAULT_CONFIG.maxContextChars;
  const maxDocumentChars = context.maxDocumentChars || DEFAULT_CONFIG.maxDocumentChars;

  let cachedCount = 0;

  const results = await runWithConcurrency(built.units, concurrency, async (u) => {
    const cacheKey = JSON.stringify({
      docId: targetDoc.id,
      docVersion,
      researchQuestion,
      technique,
      unitType,
      unitId: u.id,
      overlapCount,
      categories,
      promptTemplate,
      text: u.text,
      prevText: u.prevText,
      nextText: u.nextText
    });

    if (analysisCache.has(cacheKey)) {
      cachedCount += 1;
      return { ...analysisCache.get(cacheKey), cached: true };
    }

    const { systemPrompt, userPrompt } = buildContentAnalysisPrompts({
      doc: targetDoc,
      researchQuestion,
      technique,
      unitType,
      unitLabel: built.unitLabel,
      targetUnit: u.labelNum,
      prevText: u.prevText || "",
      currentText: u.text || "",
      nextText: u.nextText || "",
      categories,
      promptTemplate,
      maxContextChars,
      maxDocumentChars
    });

    const llmRes = await callChatCompletion({
      chatUrl,
      model: modelVal,
      apiKey,
      systemPrompt,
      userPrompt,
      temperature: 0.2,
      maxTokens: unitType === "document" ? 2000 : 1000,
      timeoutMs,
      signal: context.signal
    });

    const itemResult = {
      unit_id: u.id,
      unit: u.labelNum,
      ok: llmRes.ok,
      status: llmRes.status,
      error: llmRes.error,
      analysis: llmRes.ok ? llmRes.content : "",
      cached: false
    };

    if (llmRes.ok && llmRes.status !== "truncated") {
      analysisCache.set(cacheKey, itemResult);
    }

    return itemResult;
  });

  let synthesisText = "";
  let synthesisMeta = null;

  if (synthesize) {
    const synRes = await synthesizeUnitResults({
      chatUrl,
      model: modelVal,
      apiKey,
      doc: targetDoc,
      researchQuestion,
      technique,
      categories,
      unitLabel: built.unitLabel,
      unitResults: results,
      timeoutMs,
      signal: context.signal
    });
    synthesisText = synRes.synthesis || "";
    synthesisMeta = {
      ok: synRes.ok,
      status: synRes.status,
      error: synRes.error
    };
  }

  const stats = {
    total: results.length,
    ok: results.filter((r) => r.ok && r.status !== "truncated").length,
    truncated: results.filter((r) => r.status === "truncated").length,
    failed: results.filter((r) => !r.ok).length,
    cached: cachedCount
  };

  const report = {
    ok: stats.failed < results.length,
    dry_run: false,
    document: {
      id: targetDoc.id,
      name: targetDoc.name,
      title: targetDoc.title || targetDoc.name
    },
    research_question: researchQuestion,
    technique,
    unit_type: unitType,
    unit_label: built.unitLabel,
    scope_summary: built.scopeSummary,
    categories,
    has_custom_template: Boolean(promptTemplate && promptTemplate.trim()),
    stats,
    results,
    synthesis: synthesisText || null,
    synthesis_meta: synthesisMeta
  };

  report.markdown = formatAnalysisMarkdown(report);
  return report;
}

    async function handleSend() {
      const inputElem = document.getElementById('user-input');
      const text = inputElem.value.trim();
      if (!text) return;

      chatHistorySnapshotBeforeSend = JSON.parse(JSON.stringify(chatHistory));
      isCancelled = false;

      let messageContent = text;
      const imageParts = [];
      for (const [id, doc] of Object.entries(uploadedDocs)) {
        if (doc.isImage && doc.selected !== false) {
          imageParts.push({ type: "image_url", image_url: { url: doc.content } });
        }
      }

      if (imageParts.length > 0) {
        messageContent = [{ type: "text", text: text }, ...imageParts];
      }

      const msgIndex = chatHistory.length;
      appendMessageUI('user', text, null, msgIndex);
      chatHistory.push({ role: 'user', content: messageContent });
      inputElem.value = '';
      
      setInputsDisabled(true);
      document.getElementById('cancel-btn').style.display = 'inline-block';

      updateContextUsageDisplay();
      saveStateToLocalStorage();
      await runAgentLoop();
    }

    function cancelAgent() {
      isCancelled = true;
      if (currentAbortController) {
        currentAbortController.abort();
      }
      if (chatHistorySnapshotBeforeSend) {
        chatHistory = chatHistorySnapshotBeforeSend;
      }
      activeFrozenSystemPrompt = null;
      appendMessageUI('system-info', 'Agenten-Anfrage und Tool-Calls wurden abgebrochen.');
      
      setInputsDisabled(false);
      document.getElementById('cancel-btn').style.display = 'none';
      updateContextUsageDisplay();
      rebuildChatUI();
      saveStateToLocalStorage();
    }

    async function runAgentLoop(isFirstCall = false) {
      if (isCancelled) return;

      let endpoint = document.getElementById('endpoint').value.trim();
      
      endpoint = endpoint.replace(/\/chat\/completion\b/g, '/chat/completions');
      endpoint = endpoint.replace(/\/chat\/completions\/chat\/completions/g, '/chat/completions');
      
      if (!endpoint.includes('/chat/completions')) {
        let baseUrl = endpoint.includes('/v1/') ? endpoint.split('/v1/')[0] + '/v1' : endpoint.replace(/\/+$/, '');
        endpoint = `${baseUrl}/chat/completions`;
        document.getElementById('endpoint').value = endpoint;
      }

      const modelVal = document.getElementById('model-name').value;
      const maxContextTokens = isNaN(parseInt(document.getElementById('max-context').value)) ? 4096 : parseInt(document.getElementById('max-context').value);
      
      if (activeFrozenSystemPrompt === null) {
        activeFrozenSystemPrompt = getCompleteSystemPrompt();
      }

      let messages = [{ role: "system", content: activeFrozenSystemPrompt }, ...chatHistory];
      
      await handleContextOverflow(messages, maxContextTokens, modelVal, endpoint);
      if (isCancelled) return;

      chatHistory = messages.filter(m => m.role !== 'system');

      updateContextUsageDisplay();
      saveStateToLocalStorage();

      const tools = getAvailableToolsSchema();
      const currentPayloadMessages = [{ role: "system", content: activeFrozenSystemPrompt }, ...chatHistory];
      const payload = { model: modelVal, messages: currentPayloadMessages, temperature: 0.2, stream: true };
      if (tools.length > 0) { payload.tools = tools; payload.tool_choice = "auto"; }

      try {
        currentAbortController = new AbortController();
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: currentAbortController.signal
        });

        if (!response.ok) {
          let errorBody = "";
          try { errorBody = await response.text(); } catch(e) {}
          throw new Error(`HTTP Fehler ${response.status}: ${errorBody || response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        let accumulatedContent = "";
        let toolCallMap = {}; 
        let rawStreamChunks = [];
        let assistantDiv = null;
        let streamedSuccessfully = false;
        const msgIndex = chatHistory.length;

        while (true) {
          if (isCancelled) {
            reader.cancel();
            return;
          }
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          rawStreamChunks.push(chunk);
          const lines = chunk.split("\n");

          for (let line of lines) {
            line = line.trim();
            if (!line.startsWith("data:")) continue;
            const dataStr = line.replace(/^data:\s*/, "");
            if (dataStr === "[DONE]") continue;

            try {
              const parsed = JSON.parse(dataStr);
              if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta) {
                const delta = parsed.choices[0].delta;
                if (delta.content) {
                  if (!streamedSuccessfully) {
                    assistantDiv = createStreamingMessageContainer('assistant', msgIndex);
                    streamedSuccessfully = true;
                  }
                  accumulatedContent += delta.content;
                  updateStreamingMessageContent(assistantDiv, accumulatedContent);
                }
                if (delta.tool_calls) {
                  for (const tcDelta of delta.tool_calls) {
                    const idx = tcDelta.index;
                    if (!toolCallMap[idx]) toolCallMap[idx] = { id: "", type: "function", function: { name: "", arguments: "" } };
                    if (tcDelta.id) toolCallMap[idx].id = tcDelta.id;
                    if (tcDelta.function) {
                      if (tcDelta.function.name) toolCallMap[idx].function.name += tcDelta.function.name;
                      if (tcDelta.function.arguments) toolCallMap[idx].function.arguments += tcDelta.function.arguments;
                    }
                  }
                }
              }
            } catch (err) {}
          }
        }

        if (isCancelled) return;

        const accumulatedToolCalls = Object.values(toolCallMap);
        if (!streamedSuccessfully && accumulatedContent === "" && accumulatedToolCalls.length === 0) {
          const fullText = rawStreamChunks.join("");
          try {
            const data = JSON.parse(fullText);
            const choice = data.choices[0].message;
            accumulatedContent = choice.content || "";
            if (choice.tool_calls) accumulatedToolCalls.push(...choice.tool_calls);
          } catch(e) {
            throw new Error('Der LLM-Server hat keine gültigen Stream-Daten zurückgegeben.');
          }
        }

        const stepPayload = { model: modelVal, messages: currentPayloadMessages, temperature: 0.2 };
        if (tools.length > 0) stepPayload.tools = tools;
        const fullResponseContext = { request_payload: stepPayload, raw_stream_chunks: rawStreamChunks };

        if (accumulatedToolCalls.length === 0) {
          if (!streamedSuccessfully && accumulatedContent) appendMessageUI('assistant', accumulatedContent, fullResponseContext, msgIndex);
          else if (assistantDiv) appendDetailsToAssistant(assistantDiv, fullResponseContext);
          chatHistory.push({ role: 'assistant', content: accumulatedContent });
          
          activeFrozenSystemPrompt = null;
          setInputsDisabled(false);
          document.getElementById('cancel-btn').style.display = 'none';

          updateContextUsageDisplay();
          saveStateToLocalStorage();
          return;
        }

        const assistantMsgObj = { role: 'assistant', content: accumulatedContent || null, tool_calls: accumulatedToolCalls };
        chatHistory.push(assistantMsgObj);
        updateContextUsageDisplay();
        saveStateToLocalStorage();

        if (streamedSuccessfully && assistantDiv) appendDetailsToAssistant(assistantDiv, fullResponseContext);
        else if (accumulatedContent) appendMessageUI('assistant', accumulatedContent, fullResponseContext, msgIndex);

        for (const call of accumulatedToolCalls) {
          if (isCancelled) return;
          await processToolCall(call);
        }

        if (!isCancelled) {
          await runAgentLoop();
        }

      } catch (err) {
        if (!isCancelled) {
          appendMessageUI('system-info', `Fehler: ${err.message}`);
          activeFrozenSystemPrompt = null;
          setInputsDisabled(false);
          document.getElementById('cancel-btn').style.display = 'none';
        }
      }
    }

    async function processToolCall(call) {
      if (isCancelled) return;
      const name = call.function.name;
      let args;
      try { args = JSON.parse(call.function.arguments || "{}"); } catch(e) { args = {}; }
      const callId = call.id || "call_" + Math.random().toString(36).substr(2, 9);
      const requireApproval = document.getElementById('require-approval').checked;

      let res;
      let executedArgs = args; 
      
      const executeFn = async (currentArgs) => {
        switch (name) {
          case 'read_doc': return await perform_read_doc(currentArgs);
          case 'write_doc': return perform_write_doc(currentArgs);
          case 'gsub_doc': return perform_gsub_doc(currentArgs);
          case 'search_doc': return perform_search_doc(currentArgs);
          case 'search_web': return await perform_search_web(currentArgs.query);
          case 'fetch_url': return await perform_fetch_url(currentArgs.url || currentArgs.query);
          case 'search_wikipedia': return await perform_search_wikipedia(currentArgs.query);
          case 'get_weather': return await perform_get_weather(currentArgs.location || currentArgs.query);
          case 'calculate': return await perform_calculate(currentArgs.expression || currentArgs.query);
          case 'run_code': return perform_run_code(currentArgs.code || currentArgs.query);
          case 'run_content_analysis': return await perform_run_content_analysis(currentArgs);
          case 'generate_image': return await perform_generate_image(currentArgs.prompt || currentArgs.query);
          default: return "Unbekanntes Tool";
        }
      };

      if (requireApproval) {
        res = await new Promise((resolve) => {
          renderApprovalUI(callId, name, args, async (approved, editedArgs) => {
            if (isCancelled) { resolve("Vom Nutzer abgebrochen."); return; }
            if (approved) {
              executedArgs = editedArgs;
              call.function.arguments = JSON.stringify(editedArgs);
              resolve(await executeFn(editedArgs));
            } else {
              resolve("Vom Nutzer abgelehnt.");
            }
          });
        });
      } else {
        res = await executeFn(args);
      }

      if (isCancelled) return;

      renderToolResultUI(callId, name, executedArgs, res);
      chatHistory.push({ role: "tool", tool_call_id: callId, content: typeof res === 'string' ? res : JSON.stringify(res) });
      updateContextUsageDisplay();
      saveStateToLocalStorage();
    }

    function appendMessageUI(role, text, responseData = null, messageIndex = null) {
      const container = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;
      if (messageIndex !== null) wrapper.setAttribute('data-index', messageIndex);

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant') {
        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') div.innerHTML = marked.parse(text || '');
        else div.innerText = text || '';
      } else {
        div.innerText = text;
      }
      wrapper.appendChild(div);

      if (role === 'user' || role === 'assistant') {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'msg-action-btn';
        editBtn.innerHTML = '✎';
        editBtn.title = 'Bearbeiten';
        editBtn.onclick = () => openMessageEditModal(messageIndex);
        actionsDiv.appendChild(editBtn);

        const repeatBtn = document.createElement('button');
        repeatBtn.className = 'msg-action-btn';
        repeatBtn.innerHTML = '↻';
        repeatBtn.title = 'Wiederholen';
        repeatBtn.onclick = () => repeatMessage(messageIndex);
        actionsDiv.appendChild(repeatBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'msg-action-btn btn-del-msg';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Löschen';
        delBtn.onclick = () => deleteMessageAndFollowing(messageIndex);
        actionsDiv.appendChild(delBtn);

        wrapper.appendChild(actionsDiv);
      }

      container.appendChild(wrapper);
      if (role === 'assistant' && responseData) appendDetailsToAssistant(div, responseData);
      container.scrollTop = container.scrollHeight;
    }

    function createStreamingMessageContainer(role, messageIndex) {
      const container = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;
      if (messageIndex !== null) wrapper.setAttribute('data-index', messageIndex);

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      wrapper.appendChild(div);

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'msg-action-btn';
      editBtn.innerHTML = '✎';
      editBtn.title = 'Bearbeiten';
      editBtn.onclick = () => openMessageEditModal(messageIndex);
      actionsDiv.appendChild(editBtn);

      const repeatBtn = document.createElement('button');
      repeatBtn.className = 'msg-action-btn';
      repeatBtn.innerHTML = '↻';
      repeatBtn.title = 'Wiederholen';
      repeatBtn.onclick = () => repeatMessage(messageIndex);
      actionsDiv.appendChild(repeatBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'msg-action-btn btn-del-msg';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Löschen';
      delBtn.onclick = () => deleteMessageAndFollowing(messageIndex);
      actionsDiv.appendChild(delBtn);

      wrapper.appendChild(actionsDiv);
      container.appendChild(wrapper);
      return div;
    }

    function updateStreamingMessageContent(div, text) {
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') div.innerHTML = marked.parse(text || '');
      else div.innerText = text || '';
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    function appendDetailsToAssistant(msgDiv, responseData) {
      const details = document.createElement('details');
      details.style.cssText = 'font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; border-top: 1px solid var(--border); paddingTop: 4px; width: 100%; box-sizing: border-box;';
      details.innerHTML = `
        <summary style="cursor: pointer; user-select: none;">Details</summary>
        <pre style="background: #181825; padding: 6px; border-radius: 4px; height: 220px; width: 100%; overflow: auto; word-break: break-all; margin-top: 4px; color: var(--accent); font-family: monospace;">${JSON.stringify(responseData, null, 2)}</pre>
      `;
      msgDiv.appendChild(details);
    }

    function renderToolResultUI(callId, name, args, result) {
      const container = document.getElementById('chat-messages');
      const card = document.createElement('div');
      card.className = 'tool-call-card';
      card.innerHTML = `
        <header>🛠️ Tool Executed: ${name}</header>
        <div class="args">Input: ${JSON.stringify(args)}</div>
        <div class="result">${typeof result === 'object' ? JSON.stringify(result, null, 2) : result}</div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    function renderApprovalUI(callId, name, args, callback) {
      const container = document.getElementById('chat-messages');
      const card = document.createElement('div');
      card.className = 'tool-call-card';
      card.style.borderColor = 'var(--warning)';
      const argsString = JSON.stringify(args, null, 2);
      card.innerHTML = `
        <header style="color: var(--warning);">⚠️ Tool-Freigabe erforderlich: ${name}</header>
        <div style="margin-bottom: 6px; font-size: 0.75rem; color: var(--text-muted);">Parameter editierbar:</div>
        <textarea id="args-edit-${callId}" rows="4" style="width: 100%; margin-bottom: 6px; font-family: monospace;">${argsString}</textarea>
        <div class="approval-banner">
          <span>Ausführen?</span>
          <div>
            <button class="approval-btn" id="approve-${callId}">Freigeben</button>
            <button class="deny-btn" id="deny-${callId}">Ablehnen</button>
          </div>
        </div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;

      document.getElementById(`approve-${callId}`).onclick = () => {
        const editedText = document.getElementById(`args-edit-${callId}`).value;
        let finalArgs = args;
        try { finalArgs = JSON.parse(editedText); } catch (e) { alert("JSON-Fehler, nutze Original-Parameter."); }
        card.remove(); 
        callback(true, finalArgs); 
      };
      document.getElementById(`deny-${callId}`).onclick = () => { card.remove(); callback(false, args); };
    }


    function setInputsDisabled(disabled) {
      const sendBtn = document.getElementById('send-btn');
      const labelEl = sendBtn?.querySelector('.btn-label');
      sendBtn.disabled = disabled;
      if (labelEl) {
        labelEl.textContent = disabled ? "Läuft..." : "Senden";
      }
      document.getElementById('user-input').disabled = disabled;
    }

    function deleteMessageAndFollowing(index) {
      if (!confirm("Diese Nachricht und alle folgenden Nachrichten wirklich löschen?")) return;
      chatHistory = chatHistory.slice(0, index);
      rebuildChatUI();
      updateContextUsageDisplay();
      saveStateToLocalStorage();
    }

    function repeatMessage(index) {
      const msg = chatHistory[index];
      if (!msg) return;
      
      if (msg.role === 'assistant') {
        chatHistory = chatHistory.slice(0, index);
      } else if (msg.role === 'user') {
        chatHistory = chatHistory.slice(0, index);
      }
      rebuildChatUI();
      updateContextUsageDisplay();
      saveStateToLocalStorage();

      if (msg.role === 'user') {
        let textContent = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '');
        const msgIndex = chatHistory.length;
        appendMessageUI('user', textContent, null, msgIndex);
        chatHistory.push(msg);
        setInputsDisabled(true);
        document.getElementById('cancel-btn').style.display = 'inline-block';
        runAgentLoop();
      } else {
        setInputsDisabled(true);
        document.getElementById('cancel-btn').style.display = 'inline-block';
        runAgentLoop();
      }
    }

    function openMessageEditModal(index) {
      const msg = chatHistory[index];
      if (!msg) return;
      currentEditingIndex = index;
      let currentText = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '');
      
      document.getElementById('msg-edit-textarea').value = currentText;
      document.getElementById('msg-edit-modal').style.display = 'flex';
    }

    function closeMessageEditModal() {
      document.getElementById('msg-edit-modal').style.display = 'none';
      currentEditingIndex = null;
    }

    function saveMessageEdit() {
      if (currentEditingIndex === null) return;
      const index = currentEditingIndex;
      const msg = chatHistory[index];
      if (!msg) return;
      
      const newText = document.getElementById('msg-edit-textarea').value;
      
      if (typeof msg.content === 'string') {
        msg.content = newText;
      } else if (Array.isArray(msg.content)) {
        let textPart = msg.content.find(c => c.type === 'text');
        if (textPart) textPart.text = newText;
        else msg.content.unshift({ type: "text", text: newText });
      }

      rebuildChatUI();
      updateContextUsageDisplay();
      saveStateToLocalStorage();
      closeMessageEditModal();
      
      if (msg.role === 'user') {
        setInputsDisabled(true);
        document.getElementById('cancel-btn').style.display = 'inline-block';
        runAgentLoop();
      }
    }

    function rebuildChatUI() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '<div class="msg-wrapper system-info"><div class="msg system-info">Chat-History aktualisiert.</div></div>';
      
      const getToolResultText = (toolCallId) => {
        const found = chatHistory.find(m => m.role === 'tool' && m.tool_call_id === toolCallId);
        return found ? found.content : '[Ergebnis nicht verfügbar]';
      };

      for (let i = 0; i < chatHistory.length; i++) {
        const msg = chatHistory[i];
        if (msg.role === 'user') {
          let displayTxt = typeof msg.content === 'string' ? msg.content : (msg.content.find(c => c.type === 'text')?.text || '[Multimodale Nachricht]');
          appendMessageUI('user', displayTxt, null, i);
        } else if (msg.role === 'assistant') {
          if (msg.content) appendMessageUI('assistant', msg.content, null, i);
          if (msg.tool_calls && Array.isArray(msg.tool_calls)) {
            for (const tc of msg.tool_calls) {
              let argsParsed = {};
              try { argsParsed = JSON.parse(tc.function.arguments); } catch(e){}
              const resText = getToolResultText(tc.id);
              renderToolResultUI(tc.id, tc.function.name, argsParsed, resText);
            }
          }
        }
      }
    }

    updateMaxContextFromEndpoint(); 
    saveStateToLocalStorage();
  </script>
</body>
</html>
